name: Supabase emergency final integrity gate

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'pi/**'
      - 'scripts/**'
      - '.github/workflows/supabase-emergency-final-integrity-ci.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'supabase/**'
      - 'pi/**'
      - 'scripts/**'
      - '.github/workflows/supabase-emergency-final-integrity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate live Guardian deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          deployment = json.loads(
              Path('supabase/functions/deployment-manifest-guardian.json').read_text(encoding='utf-8')
          )
          assert deployment['project_id'] == 'dpllasnpfskyyyzebyal'
          assert deployment['canonical_model_component'] == 'edge.pi-model-gateway-guardian'
          assert deployment['canonical_model_route'] == 'supabase.opencode_model_guardian'
          assert deployment['canonical_base_url'].endswith('/pi-model-gateway-guardian/v1')
          assert deployment['canonical_pi_installer'] == 'pi-openclaw-guardian-master-installer-verified'
          assert deployment['canonical_pi_installer_url'].endswith('/pi-openclaw-guardian-master-installer-verified')
          assert deployment['canonical_pi_installer_sha256'] == 'bc938153e8b6bfe90dabb0471d34eaebef595aca6f5ec94db64d1b206cd8ce39'
          assert deployment['canonical_pi_installer_bytes'] == 3902

          expected = {
              'pi-model-gateway-guardian': (
                  1,
                  False,
                  'd8942436d02728e48ed5a4d0c488e610f618dda52dd3012053977dd8007566a9',
              ),
              'pi-infra-bootstrap': (
                  7,
                  False,
                  '35781ccb3a2209fba93b80de4f4d5843546ad65bb9bb18b76332cdcc9be8911e',
              ),
              'pi-auth-refresh': (
                  5,
                  False,
                  'aa44010cee4d26dbd35774bc14c664f648e3c5e0f45e7ed83e0004fe1da82b8c',
              ),
              'pi-work-queue': (
                  9,
                  True,
                  'cd354b3443bed92b40fddb9449123fc9966c8312866ac72e22426a170c434ec6',
              ),
              'pi-openclaw-guardian-master-installer-verified': (
                  1,
                  False,
                  'db0df75fe5f729c2a52689c4b371272aec36df81e2d080753ce128ca3c5d5fe5',
              ),
          }
          for name, (version, verify_jwt, digest) in expected.items():
              row = deployment['functions'][name]
              assert row['version'] == version, name
              assert row['status'] == 'ACTIVE', name
              assert row['verify_jwt'] is verify_jwt, name
              assert row['ezbr_sha256'] == digest, name
              assert Path(row['source']).is_file(), row['source']

          assert deployment['functions']['pi-infra-bootstrap']['refresh_token_minimum_chars'] == 8
          assert deployment['functions']['pi-auth-refresh']['refresh_token_minimum_chars'] == 8

          master = deployment['functions']['pi-openclaw-guardian-master-installer-verified']
          assert master['artifact_sha256'] == deployment['canonical_pi_installer_sha256']
          assert master['artifact_bytes'] == deployment['canonical_pi_installer_bytes']
          assert master['source_commit'] == '9237ba0c09b97a79a75464ad2e8e2e83972d5dc7'

          assert deployment['e2e_gates']['pi_model_gateway_guardian_e2e'] == 'pass'
          assert deployment['e2e_gates']['pi_recovery_queue_api_e2e'] == 'pass'
          assert deployment['e2e_gates']['pi_auth_refresh_current_format_e2e'] == 'pass'
          assert deployment['e2e_gates']['pi_guardian_master_installer_integrity'] == 'pass'
          assert deployment['physical_gates']['pi_openclaw_model_activation'] == 'pending'
          assert deployment['physical_gates']['pi_recovery_queue_worker_active'] == 'pending'

          security = deployment['security']
          assert security['provider_secret_location'] == 'supabase_edge_only'
          assert security['provider_secret_returned_to_pi'] is False
          assert security['tailscale_auth_key_default_return'] is False
          assert security['paid_api_fallback'] is False
          assert security['second_telegram_poller'] is False
          assert security['max_immediate_model_attempts'] == 2
          assert security['queue_ack_on_total_failure'] is True
          assert security['pi_refresh_token_minimum_chars'] == 8
          assert security['master_installer_nested_sha_verification'] is True
          assert security['master_installer_raw_provider_assignment'] is False
          PY

      - name: Validate Edge Function types and boundaries
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/emergency-bridge/index.ts
          deno check supabase/functions/credential-readiness/index.ts
          deno check supabase/functions/canonical-client-config/index.ts
          deno check supabase/functions/pi-infra-bootstrap/index.ts
          deno check supabase/functions/pi-auth-refresh/index.ts
          deno check supabase/functions/pi-model-gateway-guardian/index.ts
          deno check supabase/functions/pi-work-queue/index.ts
          deno check supabase/functions/pi-openclaw-guardian-master-installer-verified/index.ts

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest = json.loads(Path('supabase/functions/manifest.json').read_text(encoding='utf-8'))
          assert manifest['canonical_model_gateway'] == 'pi-model-gateway-guardian'
          assert manifest['provider_secret_location'] == 'supabase_edge_only'
          assert manifest['raw_provider_secret_returned_to_pi'] is False
          assert manifest['queue_on_provider_failure'] is True
          assert manifest['max_immediate_provider_attempts'] == 2
          assert manifest['pi_refresh_token_minimum_chars'] == 8
          assert manifest['pi_refresh_current_format_e2e'] is True
          assert manifest['functions']['pi-auth-refresh']['entrypoint'] == 'supabase/functions/pi-auth-refresh/index.ts'
          assert manifest['functions']['pi-auth-refresh']['refresh_token_minimum_chars'] == 8
          assert manifest['functions']['pi-infra-bootstrap']['refresh_token_minimum_chars'] == 8
          assert manifest['canonical_pi_installer'] == 'pi-openclaw-guardian-master-installer-verified'
          assert manifest['canonical_pi_installer_sha256'] == 'bc938153e8b6bfe90dabb0471d34eaebef595aca6f5ec94db64d1b206cd8ce39'
          assert manifest['paid_provider_calls'] is False
          assert manifest['public_shell_execution'] is False
          assert manifest['telegram_single_poller_enforced'] is True

          bootstrap = Path('supabase/functions/pi-infra-bootstrap/index.ts').read_text(encoding='utf-8')
          auth_refresh = Path('supabase/functions/pi-auth-refresh/index.ts').read_text(encoding='utf-8')
          guardian = Path('supabase/functions/pi-model-gateway-guardian/index.ts').read_text(encoding='utf-8')
          queue = Path('supabase/functions/pi-work-queue/index.ts').read_text(encoding='utf-8')
          master_edge = Path('supabase/functions/pi-openclaw-guardian-master-installer-verified/index.ts').read_text(encoding='utf-8')

          for marker in (
              'const MIN_REFRESH_TOKEN_CHARS = 8',
              'refreshSession',
              'pi-model-gateway-guardian/v1',
              'export_original_provider_key_to_pi: false',
              'start_second_telegram_poller: false',
              'surface_raw_provider_error_to_telegram: false',
              'provider_secret_returned: false',
          ):
              assert marker in bootstrap, marker

          for marker in (
              'const MIN_REFRESH_TOKEN_CHARS = 8',
              'grant_type=refresh_token',
              'pi-gateway-client',
              'token_values_logged: false',
              'server_secret_returned: false',
          ):
              assert marker in auth_refresh, marker

          for marker in (
              'const MAX_ATTEMPTS = 2',
              'async function requirePi',
              'async function queueRequest',
              'function queuedResponse',
              '요청을 안전하게 보존했습니다',
              'provider_secret_returned: false',
          ):
              assert marker in guardian, marker

          for marker in (
              'contract_version: 2',
              'ALLOWED_TYPES',
              'claim_openclaw_recovery_task',
              'secret_like_evidence_rejected',
              'server_secret_returned: false',
          ):
              assert marker in queue, marker
          assert 'eyJ[A-Za-z0-9_-]{20,}' in queue

          for marker in (
              '9237ba0c09b97a79a75464ad2e8e2e83972d5dc7',
              'bc938153e8b6bfe90dabb0471d34eaebef595aca6f5ec94db64d1b206cd8ce39',
              'const SCRIPT_BYTES = 3902',
              'artifact_sha256_mismatch',
              'artifact_contract_missing',
              'x-openclaw-provider-secret-included',
              'x-openclaw-second-telegram-poller',
              'x-openclaw-paid-fallback',
          ):
              assert marker in master_edge, marker

          combined = bootstrap + '\n' + auth_refresh + '\n' + queue
          forbidden = {
              'raw OpenCode key returned': r'OPENCODE_API_KEY\s*:',
              'legacy Tailscale env returned': r'TAILSCALE_AUTHKEY\s*:',
              'second Telegram poller': r'getUpdates|start_second_telegram_poller\s*:\s*true',
              'automatic paid fallback': r'paid_fallback(?:_enabled)?\s*[:=]\s*true',
          }
          for label, pattern in forbidden.items():
              assert re.search(pattern, combined, re.IGNORECASE) is None, label
          PY

      - name: Validate E2E-gated migrations and action-bound idempotency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = {
              '20260819080000_emergency_bridge_control_plane.sql',
              '20260819080900_zero_cost_first_route_resolver.sql',
              '202608200001_openclaw_guardian_reconciliation.sql',
              '202608200002_promote_openclaw_guardian_after_e2e.sql',
              '202608200003_bind_ledger_execution_keys_to_actions.sql',
          }
          files = {
              path.name: path.read_text(encoding='utf-8')
              for path in Path('supabase/migrations').glob('*.sql')
          }
          assert not required.difference(files), sorted(required.difference(files))

          seed = files['202608200001_openclaw_guardian_reconciliation.sql']
          for marker in (
              'bridge_model_health',
              'bridge_record_model_result',
              'claim_openclaw_recovery_task',
              'pi_model_gateway_guardian_e2e',
              'pi_recovery_queue_api_e2e',
              "'pending_audit'",
              "'not_tested'",
          ):
              assert marker in seed, marker

          promote = files['202608200002_promote_openclaw_guardian_after_e2e.sql']
          for marker in (
              "gate_key='pi_model_gateway_guardian_e2e'",
              "gate_key='pi_recovery_queue_api_e2e'",
              "component_key='edge.pi-model-gateway-guardian'",
              "component_key='edge.pi-model-gateway'",
              "component_key='edge.token-gateway'",
              "lifecycle_status='compatibility'",
              "'supabase.opencode_model_guardian'",
              "mode='disabled'",
          ):
              assert marker in promote, marker

          action_bound = ''.join(
              files['202608200003_bind_ledger_execution_keys_to_actions.sql'].split()
          ).lower()
          assert 'unique(user_id,action,execution_key)' in action_bound
          assert 'onconflict(user_id,action,execution_key)donothing' in action_bound
          assert 'unique(user_id,execution_key)' not in action_bound
          PY

      - name: Validate Pi recovery packages and reject embedded secrets
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-supabase-emergency-bridge-on-pi.sh
          bash -n pi/recover-opencode-first-tailscale-second.sh
          bash -n pi/activate-opencode-tailscale.sh
          bash -n pi/install-openclaw-recovery-queue-worker.sh
          bash -n pi/install-openclaw-guardian-master.sh
          python3 -m py_compile pi/openclaw-recovery-queue-worker.py

          grep -F 'sha256sum --check --status' pi/recover-opencode-first-tailscale-second.sh
          grep -F 'RECOVERY_MODE=SUPABASE_GUARDIAN_SCOPED_PI_JWT' pi/recover-opencode-first-tailscale-second.sh
          ! grep -Eq '^\s*(export\s+)?OPENCODE_API_KEY=' pi/recover-opencode-first-tailscale-second.sh
          ! grep -Eq '^\s*(export\s+)?TAILSCALE_AUTHKEY=' pi/recover-opencode-first-tailscale-second.sh

          grep -F 'MODEL_INSTALLER_SHA256="4c21d9eab6fff335950f8a4c8c7a064a20b9aa00aead487b811cee779e8ae947"' pi/install-openclaw-guardian-master.sh
          grep -F 'WORKER_INSTALLER_SHA256="cfa9b13c12c5937c9d0156b9279d5834ffc267986b38d51e38dd0eaac1c87c22"' pi/install-openclaw-guardian-master.sh
          grep -F 'provider_secret_exported": false' pi/install-openclaw-guardian-master.sh
          grep -F 'paid_api_fallback": false' pi/install-openclaw-guardian-master.sh
          grep -F 'second_telegram_poller": false' pi/install-openclaw-guardian-master.sh
          ! grep -Eq '^\s*(export\s+)?OPENCODE_API_KEY=' pi/install-openclaw-guardian-master.sh
          ! grep -Eq '^\s*(export\s+)?TAILSCALE_AUTHKEY=' pi/install-openclaw-guardian-master.sh

          ! grep -RInE \
            --exclude='*.md' \
            --exclude='package-lock.json' \
            --exclude='*.yml' \
            '(sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|tskey-(auth|api|client)-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
            supabase scripts pi

          rollback=supabase/rollback/20260819080000_emergency_bridge_disable.sql
          grep -F 'set enabled=false' "$rollback"
          grep -F "mode='disabled'" "$rollback"
          ! grep -Eiq '\bdrop[[:space:]]+(table|schema|function)\b' "$rollback"
