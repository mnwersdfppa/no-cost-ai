name: Supabase emergency final integrity gate

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'pi/**'
      - 'scripts/**'
      - '.github/workflows/supabase-emergency-final-integrity-ci.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'supabase/**'
      - 'pi/**'
      - 'scripts/**'
      - '.github/workflows/supabase-emergency-final-integrity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-emergency-final-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate converged Docker and native recovery manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('supabase/functions')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          guardian = json.loads((root / 'deployment-manifest-guardian.json').read_text(encoding='utf-8'))
          delivery = json.loads((root / 'deployment-manifest-retry-delivery.json').read_text(encoding='utf-8'))

          project = 'dpllasnpfskyyyzebyal'
          sha_re = re.compile(r'^[0-9a-f]{64}$')
          digest_re = re.compile(r'^sha256:[0-9a-f]{64}$')
          canonical_installer = 'pi-openclaw-docker-compat-installer-verified'
          canonical_source = 'pi/install-openclaw-docker-compat.sh'
          native_installer = 'pi-openclaw-current-master-recovery-verified'
          native_source = 'pi-openclaw-master-recovery-installer'

          assert manifest['project_id'] == guardian['project_id'] == delivery['project_id'] == project
          assert manifest['canonical_model_gateway'] == 'pi-model-gateway-guardian'
          assert manifest['canonical_model_provider'] == 'supabase-opencode'
          assert guardian['canonical_model_component'] == 'edge.pi-model-gateway-guardian'
          assert guardian['canonical_model_route'] == 'supabase.opencode_model_guardian'
          assert guardian['canonical_base_url'].endswith('/pi-model-gateway-guardian/v1')

          assert manifest['pi_refresh_token_minimum_chars'] == 8
          assert manifest['pi_refresh_current_format_e2e'] is True
          assert manifest['functions']['pi-auth-refresh']['refresh_token_minimum_chars'] == 8
          assert manifest['functions']['pi-infra-bootstrap']['refresh_token_minimum_chars'] == 8
          assert manifest['functions']['pi-container-bootstrap']['refresh_token_minimum_chars'] == 8
          assert guardian['functions']['pi-auth-refresh']['refresh_token_minimum_chars'] == 8
          assert guardian['functions']['pi-infra-bootstrap']['refresh_token_minimum_chars'] == 8
          assert guardian['functions']['pi-container-bootstrap']['refresh_token_minimum_chars'] == 8
          assert delivery['functions']['pi-container-bootstrap']['refresh_token_minimum_chars'] == 8

          assert manifest['canonical_server_retry_job'] == guardian['canonical_server_retry_job'] == delivery['canonical_server_retry_job']
          assert manifest['canonical_server_retry_schedule'] == guardian['canonical_server_retry_schedule'] == delivery['server_retry_schedule'] == '*/2 * * * *'
          assert manifest['server_retry_auth'] == 'supabase_vault_sha256_verification'
          assert manifest['server_retry_raw_token_persisted'] is False

          for document in (manifest, guardian, delivery):
              assert document['canonical_pi_installer'] == canonical_installer
              assert document['canonical_pi_installer_sha256'] == manifest['canonical_pi_installer_sha256']
              assert document['canonical_pi_installer_bytes'] == manifest['canonical_pi_installer_bytes']
              assert sha_re.fullmatch(document['canonical_pi_installer_sha256'])
              assert document['canonical_pi_installer_bytes'] > 6000
          assert guardian['canonical_pi_installer_source'] == delivery['canonical_pi_installer_source'] == canonical_source
          assert Path(canonical_source).is_file()

          assert manifest['canonical_container_bootstrap'] == guardian['canonical_container_bootstrap'] == delivery['canonical_container_bootstrap'] == 'pi-container-bootstrap'
          assert manifest['canonical_container_bootstrap_version'] == guardian['canonical_container_bootstrap_version'] == delivery['canonical_container_bootstrap_version'] == 3
          assert manifest['canonical_container_digest'] == guardian['canonical_container_digest'] == delivery['canonical_container_digest']
          assert digest_re.fullmatch(manifest['canonical_container_digest'])
          assert manifest['canonical_container_platforms'] == guardian['canonical_container_platforms'] == delivery['canonical_container_platforms'] == ['linux/amd64', 'linux/arm64']

          assert manifest['native_recovery_installer'] == guardian['native_recovery_installer'] == delivery['native_recovery_installer'] == native_installer
          assert guardian['native_recovery_installer_source'] == delivery['native_recovery_installer_source'] == native_source
          assert manifest['native_recovery_installer_sha256'] == guardian['native_recovery_installer_sha256'] == delivery['native_recovery_installer_sha256']
          assert sha_re.fullmatch(manifest['native_recovery_installer_sha256'])
          assert guardian['native_recovery_installer_bytes'] == delivery['native_recovery_installer_bytes'] == 2973

          docker_guardian = guardian['functions'][canonical_installer]
          docker_delivery = delivery['functions'][canonical_installer]
          assert docker_guardian['canonical'] is True and docker_delivery['canonical'] is True
          assert docker_guardian['status'] == docker_delivery['status'] == 'ACTIVE'
          assert docker_guardian['artifact_sha256'] == docker_delivery['artifact_sha256'] == manifest['canonical_pi_installer_sha256']
          assert docker_guardian['artifact_bytes'] == docker_delivery['artifact_bytes'] == manifest['canonical_pi_installer_bytes']
          assert docker_guardian['image_digest'] == docker_delivery['image_digest'] == manifest['canonical_container_digest']
          assert docker_guardian['platforms'] == docker_delivery['platforms'] == manifest['canonical_container_platforms']

          native_guardian = guardian['functions'][native_installer]
          native_delivery = delivery['functions'][native_installer]
          for row in (native_guardian, native_delivery):
              assert row['canonical'] is False
              assert row['lifecycle_status'] == 'native_rollback'
              assert row['artifact_sha256'] == manifest['native_recovery_installer_sha256']
              assert row['artifact_bytes'] == 2973

          retry_guardian = guardian['functions']['model-retry-worker']
          retry_delivery = delivery['functions']['model-retry-worker']
          assert retry_guardian['version'] == retry_delivery['version'] == 6
          assert retry_guardian['ezbr_sha256'] == retry_delivery['ezbr_sha256']
          assert retry_guardian['auth_mode'] == retry_delivery['custom_auth'] == 'supabase_vault_sha256_verification'
          assert retry_guardian['positive_auth_status'] == retry_delivery['positive_auth_status'] == 200
          assert retry_guardian['negative_auth_status'] == retry_delivery['negative_auth_status'] == 401

          for name, row in guardian['functions'].items():
              assert row['status'] == 'ACTIVE', name
              if 'source' in row:
                  assert Path(row['source']).is_file(), row['source']
              if 'ezbr_sha256' in row:
                  assert sha_re.fullmatch(row['ezbr_sha256']), name
          for name, row in delivery['functions'].items():
              assert row['status'] == 'ACTIVE', name
              if 'source' in row:
                  assert Path(row['source']).is_file(), row['source']

          for gate in (
              'pi_model_gateway_guardian_e2e',
              'pi_recovery_queue_api_e2e',
              'pi_auth_refresh_current_format_e2e',
              'recovery_queue_contract_drift_guard',
              'server_model_retry_scheduler',
              'pi_recovery_worker_current_installer_integrity',
              'pi_current_master_installer_integrity',
              'docker_registry_multiarch_publish',
              'pi_container_bootstrap_v3_e2e',
              'docker_preemptive_compatibility_system',
              'pi_docker_compat_installer_integrity',
          ):
              assert guardian['e2e_gates'][gate] == 'pass', gate
          for gate in (
              'server_model_retry_worker_e2e',
              'server_model_retry_scheduler',
              'pi_result_delivery_queue_e2e',
              'pi_recovery_worker_current_installer_integrity',
              'pi_current_master_installer_integrity',
              'docker_registry_multiarch_publish',
              'pi_container_bootstrap_v3_e2e',
              'docker_preemptive_compatibility_system',
              'pi_docker_compat_installer_integrity',
          ):
              assert delivery['e2e_gates'][gate] == 'pass', gate

          for document in (guardian, delivery):
              assert document['physical_gates']['pi_openclaw_model_activation'] == 'pending'
              assert document['physical_gates']['pi_recovery_queue_worker_active'] == 'pending'

          assert manifest['provider_secret_location'] == 'supabase_edge_only'
          assert manifest['raw_provider_secret_returned_to_pi'] is False
          assert manifest['docker_socket_mount'] is False
          assert manifest['docker_provider_secret_mount'] is False
          assert manifest['docker_privileged_default'] is False
          assert manifest['docker_qemu_default'] is False
          assert manifest['paid_provider_calls'] is False
          assert manifest['public_shell_execution'] is False
          assert manifest['telegram_single_poller_enforced'] is True
          for security in (guardian['security'], delivery['security']):
              assert security['provider_secret_returned_to_pi'] is False
              assert security['docker_registry_secret_returned_to_pi'] is False
              assert security['paid_api_fallback'] is False
              assert security['second_telegram_poller'] is False
          assert guardian['security']['docker_socket_mount'] is False
          assert guardian['security']['privileged_container'] is False
          assert guardian['security']['curl_pipe_shell'] is False
          assert delivery['security']['direct_telegram_get_updates'] is False
          assert delivery['security']['worker_token_returned'] is False
          assert delivery['security']['worker_token_persisted'] is False

          print(json.dumps({
              'result': 'pass',
              'canonical_installer': canonical_installer,
              'canonical_installer_sha256': manifest['canonical_pi_installer_sha256'],
              'native_rollback_installer': native_installer,
              'retry_worker_version': retry_guardian['version'],
              'physical_pi_pending': True,
              'secret_values_included': False,
          }, sort_keys=True))
          PY

      - name: Type-check manifest-declared Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/edge-entrypoints.txt
          import json
          from pathlib import Path

          manifest = json.loads(Path('supabase/functions/manifest.json').read_text(encoding='utf-8'))
          for row in manifest['functions'].values():
              entrypoint = row.get('entrypoint')
              if isinstance(entrypoint, str):
                  print(entrypoint)
          PY
          while IFS= read -r entrypoint; do
            test -f "$entrypoint"
            deno check "$entrypoint"
          done < /tmp/edge-entrypoints.txt

      - name: Validate runtime safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = {
              'bootstrap': Path('supabase/functions/pi-infra-bootstrap/index.ts'),
              'container_bootstrap': Path('supabase/functions/pi-container-bootstrap/index.ts'),
              'refresh': Path('supabase/functions/pi-auth-refresh/index.ts'),
              'guardian': Path('supabase/functions/pi-model-gateway-guardian/index.ts'),
              'queue': Path('supabase/functions/pi-work-queue/index.ts'),
              'retry': Path('supabase/functions/model-retry-worker/index.ts'),
              'delivery': Path('supabase/functions/pi-result-delivery-queue/index.ts'),
              'docker_installer': Path('supabase/functions/pi-openclaw-docker-compat-installer-verified/index.ts'),
              'native_source': Path('supabase/functions/pi-openclaw-master-recovery-installer/index.ts'),
              'native_verified': Path('supabase/functions/pi-openclaw-current-master-recovery-verified/index.ts'),
          }
          text = {name: path.read_text(encoding='utf-8') for name, path in paths.items()}

          assert 'const MIN_REFRESH_TOKEN_CHARS = 8' in text['bootstrap']
          assert 'const MIN_REFRESH_TOKEN_CHARS = 8' in text['container_bootstrap']
          assert 'const MIN_REFRESH_TOKEN_CHARS = 8' in text['refresh']
          assert 'pi-model-gateway-guardian/v1' in text['bootstrap']
          assert 'start_second_telegram_poller: false' in text['bootstrap']
          assert 'export_original_provider_key_to_pi: false' in text['bootstrap']
          assert 'typedExecutionPlan' in text['container_bootstrap']
          assert 'docker_socket_mount: false' in text['container_bootstrap']
          assert 'provider_secret_mount: false' in text['container_bootstrap']
          assert 'const MAX_ATTEMPTS = 2' in text['guardian']
          assert '요청을 안전하게 보존했습니다' in text['guardian']
          assert 'contract_version: 2' in text['queue']
          assert 'ALLOWED_TYPES' in text['queue']
          assert 'x-openclaw-scheduler-token' in text['retry']
          assert 'bridge_claim_model_retry_task' in text['retry']
          assert 'telegram_result_delivery' in text['retry']
          assert 'bridge_claim_telegram_delivery_task' in text['delivery']
          assert 'secret_like_evidence_rejected' in text['delivery']
          assert 'IMAGE_DIGEST' in text['docker_installer']
          assert 'docker_registry_secret_returned' in text['docker_installer']
          assert 'sha256sum -c -' in text['native_source']
          assert 'x-content-sha256' in text['native_verified']

          combined = '\n'.join(text.values())
          forbidden = {
              'raw OpenCode key response': r'OPENCODE_API_KEY\s*:',
              'legacy Tailscale key response': r'TAILSCALE_AUTHKEY\s*:',
              'second Telegram poller': r'getUpdates|start_second_telegram_poller\s*:\s*true',
              'automatic paid fallback': r'paid_fallback(?:_enabled)?\s*[:=]\s*true',
              'curl pipe shell': r'curl\s*\|\s*(?:sh|bash)',
          }
          for label, pattern in forbidden.items():
              assert re.search(pattern, combined, re.IGNORECASE) is None, label
          PY

      - name: Validate migrations and Pi recovery packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          manifest = json.loads(pathlib.Path('supabase/functions/manifest.json').read_text(encoding='utf-8'))
          migration = pathlib.Path(manifest['recovery_queue_contract_migration'])
          assert migration.is_file(), migration
          migration_text = migration.read_text(encoding='utf-8')
          for marker in (
              'openclaw_recovery_task_contract_guard',
              'pi_supabase_auth_model_recovery',
              'worker_liveness_guardian',
              'telegram_model_failover_repair',
          ):
              assert marker in migration_text, marker

          scheduler = pathlib.Path('supabase/migrations/202608200004_harden_model_retry_scheduler_v2.sql')
          assert scheduler.is_file()
          scheduler_text = scheduler.read_text(encoding='utf-8')
          for marker in (
              'openclaw-model-retry-worker-v2',
              "'*/2 * * * *'",
              'bridge_verify_model_retry_worker_token',
              'bridge_invoke_model_retry_worker',
          ):
              assert marker in scheduler_text, marker

          secret = re.compile(
              r'(sk-proj-[A-Za-z0-9_-]{16,}|(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}|'
              r'xox[baprs]-[A-Za-z0-9-]{20,}|tskey-(?:auth|api|client)-[A-Za-z0-9_-]{16,})'
          )
          for path in pathlib.Path('pi').glob('*'):
              if not path.is_file():
                  continue
              content = path.read_text(encoding='utf-8', errors='replace')
              assert secret.search(content) is None, path
              assert 'getUpdates' not in content, path
              assert re.search(r'curl\s*\|\s*(?:sh|bash)', content) is None, path
          PY

          python3 -m py_compile pi/openclaw-recovery-worker-current.py
          python3 pi/openclaw-recovery-worker-current.py --self-test
          bash -n pi/install-openclaw-docker-compat.sh
          find pi -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Write final integrity summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Supabase emergency final integrity gate'
            echo
            echo '- Canonical runtime: Docker compatibility preflight → verified native recovery'
            echo '- Canonical installer: pi-openclaw-docker-compat-installer-verified'
            echo '- Native rollback: pi-openclaw-current-master-recovery-verified'
            echo '- Retry schedule: every two minutes'
            echo '- Paid API fallback: OFF'
            echo '- Second Telegram poller: OFF'
            echo '- Docker socket mount: OFF'
            echo '- Repository mutation from workflow: OFF'
            echo '- Production deployment from workflow: OFF'
          } >> "$GITHUB_STEP_SUMMARY"
