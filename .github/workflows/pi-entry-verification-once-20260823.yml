name: Pi5 physical entry verification once 20260823

on:
  push:
    branches:
      - ops/pi-entry-verification-20260823
    paths:
      - '.github/workflows/pi-entry-verification-once-20260823.yml'
      - 'ops/pi-entry/physical-entry-runner.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pi-entry-verification-20260823
  cancel-in-progress: false

jobs:
  verify-physical-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-oidc-pi-entry-broker-once-20260823
      OIDC_AUDIENCE: odi-pi-entry-20260823-v1
      RUNNER_PATH: ops/pi-entry/physical-entry-runner.sh
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify runner from exact Git object
        id: integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$RUNNER_PATH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          EXPECTED_BLOB="$(git rev-parse "${GITHUB_SHA}:${RUNNER_PATH}")"
          ACTUAL_BLOB="$(git hash-object "$RUNNER_PATH")"
          test "$EXPECTED_BLOB" = "$ACTUAL_BLOB"
          RUNNER_SHA256="$(sha256sum "$RUNNER_PATH" | awk '{print $1}')"
          RUNNER_BYTES="$(wc -c < "$RUNNER_PATH" | tr -d ' ')"
          [[ "$EXPECTED_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RUNNER_BYTES" =~ ^[0-9]+$ ]]
          bash -n "$RUNNER_PATH"
          chmod 700 "$RUNNER_PATH"
          echo "runner_blob_sha=$EXPECTED_BLOB" >> "$GITHUB_OUTPUT"
          echo "runner_sha256=$RUNNER_SHA256" >> "$GITHUB_OUTPUT"
          echo "runner_bytes=$RUNNER_BYTES" >> "$GITHUB_OUTPUT"

      - name: Exchange exact GitHub OIDC identity for encrypted one-time values
        id: broker
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p artifacts
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/recipient-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/recipient-private.pem -pubout -outform DER -out /tmp/recipient-public.der
          PUBLIC_SPKI_B64="$(base64 -w0 /tmp/recipient-public.der)"
          OIDC_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          unset OIDC_JSON
          python3 - "$PUBLIC_SPKI_B64" '${{ steps.integrity.outputs.runner_blob_sha }}' '${{ steps.integrity.outputs.runner_sha256 }}' '${{ steps.integrity.outputs.runner_bytes }}' >/tmp/broker-body.json <<'PY'
          import json,sys
          public_spki,blob_sha,sha256,byte_count=sys.argv[1:]
          print(json.dumps({
            'mode':'open',
            'public_spki_b64':public_spki,
            'runner_blob_sha':blob_sha,
            'runner_sha256':sha256,
            'runner_bytes':int(byte_count),
          },separators=(',',':')))
          PY
          HTTP_STATUS="$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'content-type: application/json' \
            --data-binary @/tmp/broker-body.json "$BROKER_URL" \
            --output /tmp/broker-response.json --write-out '%{http_code}')"
          unset OIDC_TOKEN PUBLIC_SPKI_B64
          python3 - "$HTTP_STATUS" <<'PY'
          import base64,json,os,pathlib,sys
          status=int(sys.argv[1])
          path=pathlib.Path('/tmp/broker-response.json')
          try: data=json.loads(path.read_text(encoding='utf-8'))
          except Exception: data={}
          safe={
            'http_status':status,
            'ok':data.get('ok') is True,
            'error':str(data.get('error') or '')[:120] or None,
            'actual_raspberry_pi_5_in_tailnet':data.get('actual_raspberry_pi_5_in_tailnet'),
            'runner_integrity_verified_by_exact_commit':data.get('runner_integrity_verified_by_exact_commit'),
            'candidate_count':len(data.get('candidates',[])) if isinstance(data.get('candidates'),list) else 0,
            'bootstrap_capability_available':data.get('bootstrap_capability_available') is True,
            'auth_key_ephemeral':data.get('auth_key_ephemeral') is True,
            'auth_key_reusable_within_window':data.get('auth_key_reusable_within_window') is True,
            'acl_permission_changed':False,
            'secret_values_included':False,
          }
          pathlib.Path('artifacts/broker-summary.json').write_text(json.dumps(safe,separators=(',',':')),encoding='utf-8')
          if status < 200 or status >= 300 or data.get('ok') is not True:
            raise SystemExit(20)
          required=['encrypted_auth_key_b64','encrypted_pi_password_b64','candidates','expected_pi','bootstrap_runner']
          if any(key not in data for key in required): raise SystemExit('broker_response_incomplete')
          pathlib.Path('/tmp/broker-safe.json').write_text(json.dumps({
            'candidates':data.get('candidates',[]),
            'expected_pi':data.get('expected_pi',{}),
            'bootstrap_runner':data.get('bootstrap_runner',{}),
            'bootstrap_capability_available':data.get('bootstrap_capability_available') is True,
            'recipient_public_spki_sha256':data.get('recipient_public_spki_sha256'),
            'secret_values_included':False,
          },separators=(',',':')),encoding='utf-8')
          for field,target in [
            ('encrypted_auth_key_b64','/tmp/auth-key.bin'),
            ('encrypted_pi_password_b64','/tmp/pi-password.bin'),
          ]:
            pathlib.Path(target).write_bytes(base64.b64decode(data[field],validate=True))
          if isinstance(data.get('encrypted_bootstrap_token_b64'),str):
            pathlib.Path('/tmp/bootstrap-token.bin').write_bytes(base64.b64decode(data['encrypted_bootstrap_token_b64'],validate=True))
          for target in ['/tmp/broker-safe.json','/tmp/auth-key.bin','/tmp/pi-password.bin','/tmp/bootstrap-token.bin']:
            p=pathlib.Path(target)
            if p.exists(): os.chmod(p,0o600)
          PY
          for spec in 'auth-key.bin:tailscale-auth-key' 'pi-password.bin:pi-ssh-password'; do
            in="/tmp/${spec%%:*}"; out="/tmp/${spec##*:}"
            openssl pkeyutl -decrypt -inkey /tmp/recipient-private.pem -in "$in" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$out"
            chmod 600 "$out"
          done
          if [[ -f /tmp/bootstrap-token.bin ]]; then
            openssl pkeyutl -decrypt -inkey /tmp/recipient-private.pem -in /tmp/bootstrap-token.bin \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/bootstrap-token
            chmod 600 /tmp/bootstrap-token
          else
            : > /tmp/bootstrap-token
            chmod 600 /tmp/bootstrap-token
          fi
          AUTHKEY="$(cat /tmp/tailscale-auth-key)"
          PI_PASSWORD="$(cat /tmp/pi-ssh-password)"
          [[ "$AUTHKEY" == tskey-auth-* ]]
          [[ ${#PI_PASSWORD} -ge 8 ]]
          echo "::add-mask::$AUTHKEY"
          echo "::add-mask::$PI_PASSWORD"
          if [[ -s /tmp/bootstrap-token ]]; then
            BOOTSTRAP="$(cat /tmp/bootstrap-token)"
            [[ ${#BOOTSTRAP} -ge 32 ]]
            echo "::add-mask::$BOOTSTRAP"
            unset BOOTSTRAP
          fi
          echo "authkey=$AUTHKEY" >> "$GITHUB_OUTPUT"
          echo "opened=true" >> "$GITHUB_OUTPUT"
          unset AUTHKEY PI_PASSWORD
          rm -f /tmp/recipient-private.pem /tmp/recipient-public.der /tmp/auth-key.bin /tmp/pi-password.bin /tmp/bootstrap-token.bin /tmp/broker-response.json /tmp/broker-body.json

      - name: Join existing Tailnet ephemerally without ACL changes
        if: steps.broker.outputs.opened == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ steps.broker.outputs.authkey }}
          hostname: odi-pi-entry-${{ github.run_id }}
          statedir: /tmp/tailscale-state/
          version: 1.82.0
          timeout: 2m
          retry: 5

      - name: Identify the actual Pi5 and execute only the bounded runner
        if: steps.broker.outputs.opened == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          trap 'rm -f /tmp/pi-askpass /tmp/pi-known-hosts /tmp/candidates.txt /tmp/remote-entry.sh /tmp/bootstrap-token /tmp/pi-ssh-password /tmp/tailscale-auth-key /tmp/broker-safe.json' EXIT
          : > artifacts/standard-ssh-probe.log
          cat > /tmp/pi-askpass <<'SH'
          #!/bin/sh
          cat /tmp/pi-ssh-password
          SH
          chmod 700 /tmp/pi-askpass
          python3 - <<'PY' >/tmp/candidates.txt
          import json
          data=json.load(open('/tmp/broker-safe.json'))
          seen=set()
          for row in data.get('candidates',[]):
            for address in row.get('addresses',[]):
              address=str(address)
              if '.' in address and address not in seen:
                seen.add(address)
                print(address,str(row.get('name') or ''),str(row.get('hostname') or ''),sep='\t')
          PY
          SSH_USER="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["expected_pi"]["ssh_user"])')"
          safe_probe='MODEL=unknown; if [ -r /proc/device-tree/model ]; then MODEL=$(tr -d "\000" </proc/device-tree/model | tr -cd "A-Za-z0-9 ._/-" | head -c 120); fi; OC=false; if command -v openclaw >/dev/null 2>&1 || [ -f "$HOME/.openclaw/openclaw.json" ]; then OC=true; fi; printf "SAFE host=%s user=%s arch=%s model=%s openclaw=%s\n" "$(hostname | tr -cd "A-Za-z0-9._-")" "$(id -un | tr -cd "A-Za-z0-9._-")" "$(uname -m | tr -cd "A-Za-z0-9._/-")" "$MODEL" "$OC"'
          TARGET=""
          while IFS=$'\t' read -r candidate device_name device_hostname; do
            [[ -n "$candidate" ]] || continue
            timeout 15s tailscale ping --c 2 --timeout 5s "$candidate" >/dev/null 2>&1 || continue
            INFO="$(timeout 30s env DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS=/tmp/pi-askpass \
              setsid -w ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=8 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/pi-known-hosts -o LogLevel=ERROR \
              "${SSH_USER}@${candidate}" "$safe_probe" 2>/dev/null || true)"
            [[ -n "$INFO" ]] || continue
            if grep -Fq 'model=Raspberry Pi 5' <<<"$INFO"; then TARGET="$candidate"; break; fi
          done </tmp/candidates.txt
          if [[ -z "$TARGET" ]]; then
            printf '{"result":"blocked","reason":"actual_raspberry_pi_5_not_in_tailnet","secret_values_included":false}\n' > artifacts/route-result.json
            exit 20
          fi
          python3 - "$RUNNER_PATH" /tmp/remote-entry.sh <<'PY'
          import pathlib,shlex,sys
          source,target=sys.argv[1:]
          script=pathlib.Path(source).read_text(encoding='utf-8')
          token_path=pathlib.Path('/tmp/bootstrap-token')
          prefix=''
          if token_path.is_file() and token_path.stat().st_size:
            prefix='export ODI_BOOTSTRAP_TOKEN='+shlex.quote(token_path.read_text())+'\n'
          pathlib.Path(target).write_text(prefix+script,encoding='utf-8')
          pathlib.Path(target).chmod(0o700)
          PY
          timeout 12m env DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS=/tmp/pi-askpass \
            setsid -w ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/tmp/pi-known-hosts -o LogLevel=ERROR \
            "${SSH_USER}@${TARGET}" 'bash -s' < /tmp/remote-entry.sh > artifacts/recovery-output.log 2>&1
          printf '{"result":"executed","mode":"standard_ssh_over_existing_tailnet","secret_values_included":false}\n' > artifacts/route-result.json

      - name: Revoke the one-time Tailnet key
        if: always() && steps.broker.outputs.opened == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          unset OIDC_JSON
          curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'content-type: application/json' \
            --data '{"mode":"cleanup"}' "$BROKER_URL" \
            --output /tmp/broker-cleanup.json --write-out '%{http_code}\n' || true
          unset OIDC_TOKEN
          rm -f /tmp/broker-cleanup.json

      - name: Collect only redacted evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 - '${{ steps.integrity.outputs.runner_blob_sha }}' '${{ steps.integrity.outputs.runner_sha256 }}' '${{ steps.integrity.outputs.runner_bytes }}' <<'PY'
          import json,pathlib,sys
          blob_sha,sha256,byte_count=sys.argv[1:]
          route_path=pathlib.Path('artifacts/route-result.json')
          route=json.loads(route_path.read_text()) if route_path.is_file() else {'result':'blocked','reason':'broker_or_route_not_completed'}
          output=pathlib.Path('artifacts/recovery-output.log')
          markers=[]
          if output.is_file():
            text=output.read_text(encoding='utf-8',errors='replace')
            for marker in ('PHYSICAL_ENTRY_VERIFIED','SEQUENCE_ADVANCED'):
              if marker in text: markers.append(marker)
            output.write_text('\n'.join(markers)+('\n' if markers else ''),encoding='utf-8')
          summary={
            'route_result':route.get('result'),
            'route_reason':route.get('reason'),
            'markers':markers,
            'physical_command_executed':route.get('result')=='executed',
            'runner_integrity_mode':'git_object_from_exact_oidc_commit',
            'runner_blob_sha':blob_sha,
            'runner_sha256':sha256,
            'runner_bytes':int(byte_count) if byte_count.isdigit() else None,
            'acl_permission_changed':False,
            'host_rebooted':False,
            'data_or_volume_deleted':False,
            'second_scheduler_created':False,
            'second_telegram_poller_created':False,
            'secret_values_included':False,
          }
          pathlib.Path('artifacts/summary.json').write_text(json.dumps(summary,separators=(',',':')),encoding='utf-8')
          print(json.dumps(summary,separators=(',',':')))
          PY
          rm -f /tmp/pi-askpass /tmp/pi-known-hosts /tmp/candidates.txt /tmp/remote-entry.sh /tmp/bootstrap-token /tmp/pi-ssh-password /tmp/tailscale-auth-key /tmp/broker-safe.json /tmp/recipient-private.pem /tmp/recipient-public.der

      - name: Upload secret-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-entry-verification-20260823-evidence
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 3
