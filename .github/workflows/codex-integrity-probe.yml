name: Codex package integrity probe

on:
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - '.github/workflows/codex-integrity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Print immutable npm metadata for review
        shell: bash
        run: |
          set -euo pipefail
          printf 'CODEX_VERSION=%s\n' '0.146.0'
          printf 'CODEX_INTEGRITY=%s\n' "$(npm view @openai/codex@0.146.0 dist.integrity)"
          printf 'CODEX_SHASUM=%s\n' "$(npm view @openai/codex@0.146.0 dist.shasum)"
          printf 'CODEX_TARBALL=%s\n' "$(npm view @openai/codex@0.146.0 dist.tarball)"
