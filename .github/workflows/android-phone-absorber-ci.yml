name: android-phone-absorber-ci

on:
  pull_request:
    paths:
      - 'android-node/**'
      - '.github/workflows/android-phone-absorber-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/**'
      - '.github/workflows/android-phone-absorber-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shell scripts
        run: |
          for file in \
            android-node/bootstrap-all.sh \
            android-node/install-pi-phone-absorber.sh \
            android-node/install-pi-bridge.sh \
            android-node/phone-termux-bootstrap.sh \
            android-node/verify-phone-bridge.sh \
            android-node/enable-phone-write.sh \
            android-node/disable-phone-write.sh \
            android-node/pair-openclaw-node.sh \
            android-node/rollback-pi-phone-absorber.sh \
            android-node/phone-codex-cli-backend/phone-codex-cli-backend.sh; do
            bash -n "$file"
          done
      - name: Assert phone runtime safety contract
        run: |
          set -euo pipefail
          grep -Fq 'restrict,command="$HOME/.local/bin/openclaw-phone-ssh-dispatch"' android-node/phone-termux-bootstrap.sh
          grep -Fq 'features.shell_tool=false' android-node/phone-termux-bootstrap.sh
          grep -Fq 'features.web_search_request=false' android-node/phone-termux-bootstrap.sh
          grep -Fq 'features.apps=false' android-node/phone-termux-bootstrap.sh
          grep -Fq 'features.plugins=false' android-node/phone-termux-bootstrap.sh
          grep -Fq 'approval_policy=\"never\"' android-node/phone-termux-bootstrap.sh
          grep -Fq 'BLOCKED=LIVE_LLM_TEST_REQUIRED_BEFORE_ENABLE' android-node/verify-phone-bridge.sh
          grep -Fq 'DENIED=COMMAND_NOT_ALLOWLISTED' android-node/phone-termux-bootstrap.sh
          ! grep -RInE --exclude='*.md' --exclude='package-lock.json' '(sk-proj-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' android-node
      - name: Validate ADB MCP server
        working-directory: android-node/adb-mcp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Validate phone Codex MCP server
        working-directory: android-node/codex-phone-mcp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Validate phone Codex CLI backend plugin
        working-directory: android-node/phone-codex-cli-backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 --esModuleInterop index.ts
          export HOME="$RUNNER_TEMP/openclaw-home"
          mkdir -p "$HOME"
          npx openclaw plugins install -l "$PWD"
          npx openclaw plugins enable phone-codex-cli
          npx openclaw plugins inspect phone-codex-cli --runtime
      - name: Validate deployment packet
        run: python3 -m json.tool android-node/DEPLOYMENT_PACKET.json >/dev/null
