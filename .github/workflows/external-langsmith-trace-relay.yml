name: External LangSmith OAuth Trace Relay

on:
  push:
    branches:
      - main
    paths:
      - "external-orchestrator/langsmith_trace_relay.py"
      - ".github/workflows/external-langsmith-trace-relay.yml"
  pull_request:
    paths:
      - "external-orchestrator/langsmith_trace_relay.py"
      - ".github/workflows/external-langsmith-trace-relay.yml"
  schedule:
    - cron: "18,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: external-langsmith-trace-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: "https://dpllasnpfskyyyzebyal.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_viagFw0ulnaiKvQbW_Bccg_eVnHQzct"
      SUPABASE_LANGSMITH_PROFILE_URL: "https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-langsmith-oauth-profile-20260822"
      SUPABASE_LANGSMITH_AUDIENCE: "openclaw-supabase-langsmith"
      LANGSMITH_PROJECT: "openclaw-external-orchestrator"
      LANGSMITH_RELAY_RECEIPT_PATH: "receipts/langsmith-trace-relay.json"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate relay source
        run: python -m py_compile external-orchestrator/langsmith_trace_relay.py

      - name: Acquire short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SUPABASE_LANGSMITH_AUDIENCE}")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Restore LangSmith OAuth profile from Supabase Vault
        id: profile
        shell: bash
        env:
          OIDC_TOKEN: "${{ steps.oidc.outputs.token }}"
        run: |
          set -Eeuo pipefail
          response_file="${RUNNER_TEMP}/langsmith-profile-response.json"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            "$SUPABASE_LANGSMITH_PROFILE_URL")"
          if [[ "$status" == "404" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            mkdir -p receipts
            cat > "$LANGSMITH_RELAY_RECEIPT_PATH" <<'JSON'
          {
            "result": "langsmith_oauth_profile_pending",
            "langsmith_tracing_enabled": false,
            "secret_values_included": false
          }
          JSON
            rm -f "$response_file"
            exit 0
          fi
          test "$status" = "200"
          config_dir="${RUNNER_TEMP}/langsmith"
          config_file="$config_dir/config.json"
          mkdir -p "$config_dir"
          python - "$response_file" "$config_file" <<'PY'
          import json
          import pathlib
          import sys

          response = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          data = json.loads(response.read_text(encoding="utf-8"))
          if data.get("ok") is not True or data.get("profile_found") is not True:
              raise SystemExit("langsmith_profile_not_found")
          raw = data.get("profile_json")
          if not isinstance(raw, str) or len(raw) < 32:
              raise SystemExit("langsmith_profile_invalid")
          profile = json.loads(raw)
          if not isinstance(profile, dict):
              raise SystemExit("langsmith_profile_invalid")
          target.write_text(json.dumps(profile, separators=(",", ":")), encoding="utf-8")
          target.chmod(0o600)
          PY
          rm -f "$response_file"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "config_file=$config_file" >> "$GITHUB_OUTPUT"

      - name: Install LangSmith relay dependencies
        if: steps.profile.outputs.found == 'true'
        run: pip install 'langsmith>=0.11,<1' 'requests>=2.32,<3'

      - name: Verify OAuth profile
        if: steps.profile.outputs.found == 'true'
        env:
          LANGSMITH_CONFIG_FILE: "${{ steps.profile.outputs.config_file }}"
          LANGSMITH_PROFILE: "openclaw"
        run: langsmith --profile openclaw project list --limit 1 >/dev/null

      - name: Submit bounded trace
        if: steps.profile.outputs.found == 'true'
        env:
          LANGSMITH_CONFIG_FILE: "${{ steps.profile.outputs.config_file }}"
          LANGSMITH_PROFILE: "openclaw"
          LANGSMITH_TRACING: "true"
          LANGCHAIN_TRACING_V2: "true"
        run: python external-orchestrator/langsmith_trace_relay.py

      - name: Upload secret-free receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langsmith-trace-relay-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: receipts/langsmith-trace-relay.json
