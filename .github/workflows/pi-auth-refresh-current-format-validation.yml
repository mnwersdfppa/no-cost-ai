name: Validate current-format Pi auth refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/deployed/pi-auth-refresh-v5/**'
      - 'supabase/functions/deployed/pi-infra-bootstrap-v7/**'
      - 'supabase/functions/deployment-manifest-auth-refresh-v7.json'
      - '.github/workflows/pi-auth-refresh-current-format-validation.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'supabase/functions/deployed/pi-auth-refresh-v5/**'
      - 'supabase/functions/deployed/pi-infra-bootstrap-v7/**'
      - 'supabase/functions/deployment-manifest-auth-refresh-v7.json'
      - '.github/workflows/pi-auth-refresh-current-format-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-auth-refresh-current-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Type-check deployed source snapshots
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/deployed/pi-auth-refresh-v5/index.ts
          deno check supabase/functions/deployed/pi-infra-bootstrap-v7/index.ts

      - name: Validate refresh and bootstrap contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          refresh_path = Path('supabase/functions/deployed/pi-auth-refresh-v5/index.ts')
          bootstrap_path = Path('supabase/functions/deployed/pi-infra-bootstrap-v7/index.ts')
          manifest_path = Path('supabase/functions/deployment-manifest-auth-refresh-v7.json')

          refresh = refresh_path.read_text(encoding='utf-8')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          assert manifest['project_id'] == 'dpllasnpfskyyyzebyal'
          assert manifest['functions']['pi-auth-refresh']['version'] == 5
          assert manifest['functions']['pi-infra-bootstrap']['version'] == 7
          assert manifest['functions']['pi-auth-refresh']['ezbr_sha256'] == 'aa44010cee4d26dbd35774bc14c664f648e3c5e0f45e7ed83e0004fe1da82b8c'
          assert manifest['functions']['pi-infra-bootstrap']['ezbr_sha256'] == '35781ccb3a2209fba93b80de4f4d5843546ad65bb9bb18b76332cdcc9be8911e'
          assert manifest['e2e']['result'] == 'pass'
          assert manifest['e2e']['pi_auth_refresh_status'] == 200
          assert manifest['e2e']['bootstrap_status'] == 200
          assert manifest['e2e']['temporary_user_count_after_cleanup'] == 0
          assert manifest['e2e']['temporary_ledger_count_after_cleanup'] == 0
          assert manifest['security']['paid_api_fallback'] is False
          assert manifest['security']['second_telegram_poller'] is False
          assert manifest['security']['raw_provider_secret_returned_to_pi'] is False
          assert manifest['physical_gate']['pi_openclaw_model_activation'] == 'pending'

          for marker in (
              'const MIN_REFRESH_TOKEN_CHARS = 8',
              '/auth/v1/token?grant_type=refresh_token',
              'pi-gateway-client',
              'token_values_logged: false',
              'server_secret_returned: false',
          ):
              assert marker in refresh, marker

          for marker in (
              'const MIN_REFRESH_TOKEN_CHARS = 8',
              'pi-model-gateway-guardian/v1',
              'Opencode-api-key',
              'Tailscale-fff-api-key',
              'enqueue_on_provider_overload: true',
              'start_second_telegram_poller: false',
              'export_original_provider_key_to_pi: false',
              'surface_raw_provider_error_to_telegram: false',
              'provider_secret_returned: false',
          ):
              assert marker in bootstrap, marker

          combined = refresh + '\n' + bootstrap
          forbidden = {
              'second Telegram poller': r'getUpdates|start_second_telegram_poller\s*:\s*true',
              'automatic paid fallback': r'paid_(?:api_)?fallback(?:_enabled)?\s*[:=]\s*true',
              'curl pipe shell': r'curl[^\n|]*\|\s*(?:sh|bash)',
              'GitHub personal token literal': r'ghp_[A-Za-z0-9]{20,}',
              'OpenAI/OpenRouter secret literal': r'sk-(?:proj-)?[A-Za-z0-9_-]{20,}',
              'Tailscale key literal': r'tskey-(?:auth|api|client)-[A-Za-z0-9_-]{16,}',
          }
          for label, pattern in forbidden.items():
              assert re.search(pattern, combined, re.IGNORECASE) is None, label

          print(json.dumps({
              'result': 'pass',
              'pi_auth_refresh_version': 5,
              'pi_infra_bootstrap_version': 7,
              'refresh_token_minimum': 8,
              'provider_secret_exported': False,
              'second_telegram_poller': False,
              'paid_api_fallback': False,
              'repository_mutation': False,
              'secret_values_included': False,
          }, sort_keys=True))
          PY

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Current-format Pi refresh validation'
            echo
            echo '- Local refresh-token minimum: 8 characters'
            echo '- Authoritative validator: Supabase Auth'
            echo '- Guardian bootstrap: enabled'
            echo '- Provider secret export: OFF'
            echo '- Second Telegram poller: OFF'
            echo '- Paid fallback: OFF'
            echo '- Repository mutation: OFF'
          } >> "$GITHUB_STEP_SUMMARY"
