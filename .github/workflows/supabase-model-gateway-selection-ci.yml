name: Supabase model gateway ownership gate

on:
  pull_request:
    paths:
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/functions/pi-model-gateway-guardian/**'
      - 'supabase/functions/pi-work-queue/**'
      - 'supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'
      - 'supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'
      - '.github/workflows/supabase-model-gateway-selection-ci.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/functions/pi-model-gateway-guardian/**'
      - 'supabase/functions/pi-work-queue/**'
      - 'supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'
      - 'supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'
      - '.github/workflows/supabase-model-gateway-selection-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify E2E-gated Guardian ownership
        shell: bash
        run: |
          set -euo pipefail
          seed=supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql
          promote=supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql
          guardian=supabase/functions/pi-model-gateway-guardian/index.ts
          bootstrap=supabase/functions/pi-infra-bootstrap/index.ts
          queue=supabase/functions/pi-work-queue/index.ts

          for file in "$seed" "$promote" "$guardian" "$bootstrap" "$queue"; do
            test -s "$file"
          done

          # A clean deployment must not select the model caller before E2E.
          grep -F "'edge.pi-model-gateway-guardian'" "$seed"
          grep -F "'model_gateway_guardian'" "$seed"
          grep -F "'pending_audit'" "$seed"
          grep -F "'not_tested'" "$seed"

          # Promotion requires both the model and deterministic queue E2E gates.
          grep -F "gate_key='pi_model_gateway_guardian_e2e'" "$promote"
          grep -F "gate_key='pi_recovery_queue_api_e2e'" "$promote"
          grep -F "status='pass'" "$promote"
          grep -F "component_key='edge.pi-model-gateway-guardian'" "$promote"
          grep -F "selected=true" "$promote"
          grep -F "lifecycle_status='active'" "$promote"
          grep -F "component_key='edge.pi-model-gateway'" "$promote"
          grep -F "component_key='edge.token-gateway'" "$promote"
          grep -F "selected=false" "$promote"
          grep -F "lifecycle_status='compatibility'" "$promote"
          grep -F "'supabase.opencode_model_guardian'" "$promote"
          grep -F "/pi-model-gateway-guardian/v1" "$promote"

          # The selected runtime is scoped, bounded and queue-backed.
          grep -F 'const MAX_ATTEMPTS = 2' "$guardian"
          grep -F 'async function requirePi' "$guardian"
          grep -F 'async function queueRequest' "$guardian"
          grep -F 'function queuedResponse' "$guardian"
          grep -F 'provider_secret_returned: false' "$guardian"
          grep -F 'surface_raw_provider_error_to_telegram: false' "$guardian"
          grep -F 'claim_openclaw_recovery_task' "$seed"
          grep -F 'action === "pull_recovery"' "$queue"
          grep -F 'export_original_provider_key_to_pi: false' "$bootstrap"
          grep -F 'start_second_telegram_poller: false' "$bootstrap"

      - name: Confine direct model execution to Guardian
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          guardian = Path('supabase/functions/pi-model-gateway-guardian/index.ts').read_text(encoding='utf-8')
          non_callers = [
              Path('supabase/functions/pi-infra-bootstrap/index.ts'),
              Path('supabase/functions/pi-work-queue/index.ts'),
              Path('supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'),
              Path('supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'),
          ]
          other_text = '\n'.join(path.read_text(encoding='utf-8') for path in non_callers)
          all_text = guardian + '\n' + other_text

          assert 'https://opencode.ai/zen/v1/responses' in guardian
          assert 'https://opencode.ai/zen/v1/responses' not in other_text

          forbidden = {
              'raw OpenCode key returned to Pi': r'OPENCODE_API_KEY\s*:',
              'legacy Tailscale env returned to Pi': r'TAILSCALE_AUTHKEY\s*:',
              'second Telegram poller': r'getUpdates|start_second_telegram_poller\s*:\s*true',
              'automatic paid fallback': r'paid_fallback(?:_enabled)?\s*[:=]\s*true',
              'SQL network model execution': r'\bnet\.http_(?:get|post|delete)\s*\(',
          }
          for label, pattern in forbidden.items():
              assert re.search(pattern, all_text, re.IGNORECASE) is None, label

          assert 'authorization: `Bearer ${OPENCODE_KEY}`' in guardian
          assert 'provider_secret_returned: false' in guardian
          print('Guardian ownership is deterministic and E2E-gated')
          PY
