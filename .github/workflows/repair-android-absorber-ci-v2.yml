name: Repair Android absorber CI v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-android-absorber-ci-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-android-absorber-ci-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/openclaw-android-node-absorber
      TARGET_PR: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 1

      - name: Replace stale policy checks with current hardened contract
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/android-phone-absorber-ci.yml <<'YML'
          name: android-phone-absorber-ci

          on:
            pull_request:
              paths: ['android-node/**', 'pi/**', '.github/workflows/android-phone-absorber-ci.yml']
            push:
              branches: [feat/openclaw-android-node-absorber]
              paths: ['android-node/**', 'pi/**', '.github/workflows/android-phone-absorber-ci.yml']
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
                  with:
                    node-version: '22.23.2'
                - name: Locked dependency and syntax validation
                  shell: bash
                  run: |
                    set -euo pipefail
                    for dir in android-node/adb-mcp android-node/codex-phone-mcp android-node/phone-codex-cli-backend; do
                      test -s "$dir/package-lock.json"
                      (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
                    done
                    node --check android-node/adb-mcp/server.mjs
                    node --check android-node/codex-phone-mcp/server.mjs
                    find android-node pi -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
                    python3 -m py_compile pi/pi-work-queue-worker.py
                - name: Current phone-control safety contract
                  shell: bash
                  run: |
                    set -euo pipefail
                    grep -F 'phone_open_bridge_app' android-node/adb-mcp/server.mjs
                    grep -F "z.enum(['openclaw', 'termux'])" android-node/adb-mcp/server.mjs
                    grep -F 'phone_key' android-node/adb-mcp/server.mjs
                    ! grep -E 'phone_(launch_url|tap|swipe|type_text)' android-node/adb-mcp/server.mjs
                    ! grep -RInE --exclude='*.md' --exclude='package-lock.json' '(adb_shell|ACTION_CALL|ACTION_DIAL|sendTextMessage|PHONE_RELAY_ENABLED[[:space:]]*=[[:space:]]*(1|true)|getUpdates\(|start_polling\(|run_polling\()' android-node pi
                - name: Trust, rollback, and billing gates
                  shell: bash
                  run: |
                    set -euo pipefail
                    grep -F 'SCANNED_SSH_HOST_KEY_RECORD_COUNT_INVALID' android-node/provision-phone-host-key-secure.sh
                    grep -F 'SCANNED_SSH_HOST_KEY_FINGERPRINT_MISMATCH' android-node/provision-phone-host-key-secure.sh
                    grep -F 'LEGACY_PHONE_CORE_INTERNAL_ONLY' android-node/phone-termux-bootstrap.sh
                    grep -F 'LEGACY_VERIFY_CORE_INTERNAL_ONLY' android-node/verify-phone-bridge.sh
                    grep -F 'LEGACY_ROLLBACK_CORE_INTERNAL_ONLY' android-node/rollback-pi-phone-absorber.sh
                    grep -F '"telegram_single_poller": "not_tested"' android-node/verify-phone-bridge.sh
                    grep -F 'PAID_OPENAI_AUTOMATIC_FALLBACK=OFF' pi/bootstrap-mobile-automation-safe.sh
                - name: Reject embedded credentials
                  shell: bash
                  run: |
                    set -euo pipefail
                    ! grep -RInE --exclude='*.md' --exclude='package-lock.json' --exclude='pi-work-queue-worker.py' '(sk-proj-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' android-node pi
          YML

          cat > .github/workflows/android-live-gates-ci.yml <<'YML'
          name: Android immutable live-gate checks

          on:
            pull_request:
              paths: ['android-node/**', '.github/workflows/android-live-gates-ci.yml']
            push:
              branches: [feat/openclaw-android-node-absorber]
              paths: ['android-node/**', '.github/workflows/android-live-gates-ci.yml']
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - name: Validate supported immutable entrypoints
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash -n android-node/bootstrap-all.sh
                    bash -n android-node/provision-phone-host-key-secure.sh
                    bash -n android-node/verify-phone-bridge-secure.sh
                    bash -n android-node/rollback-pi-phone-absorber-secure.sh
                    grep -F 'readonly PRODUCTION_REPO="https://github.com/mnwersdfppa/no-cost-ai.git"' android-node/bootstrap-all.sh
                    grep -E 'readonly REVIEWED_PAYLOAD_COMMIT="[0-9a-f]{40}"' android-node/bootstrap-all.sh
                    grep -F 'PHONE_ABSORBER_REPOSITORY_OVERRIDE_DENIED' android-node/bootstrap-all.sh
                    grep -F 'PHONE_ABSORBER_COMMIT_OVERRIDE_DENIED' android-node/bootstrap-all.sh
                    grep -F 'bash "$PROVISION"' android-node/verify-phone-bridge-secure.sh
                    grep -F 'OPENCLAW_SECURE_WRAPPER=1' android-node/verify-phone-bridge-secure.sh
                    grep -F 'OPENCLAW_SECURE_WRAPPER=1' android-node/phone-termux-bootstrap-secure.sh
                    grep -F 'OPENCLAW_SECURE_WRAPPER=1' android-node/rollback-pi-phone-absorber-secure.sh
                - name: Validate deployment packet and completion boundaries
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 -m json.tool android-node/DEPLOYMENT_PACKET.json >/dev/null
                    python3 - <<'PY'
                    import json
                    p=json.load(open('android-node/DEPLOYMENT_PACKET.json',encoding='utf-8'))
                    required={
                      'android-node/bootstrap-all.sh',
                      'android-node/provision-phone-host-key-secure.sh',
                      'android-node/verify-phone-bridge-secure.sh',
                      'android-node/rollback-pi-phone-absorber-secure.sh'
                    }
                    supported=set(p.get('supported_entrypoints',[]))
                    if not required.issubset(supported):
                        raise SystemExit('secure entrypoints missing')
                    if p.get('root_required') is not False:
                        raise SystemExit('root boundary changed')
                    if p.get('telegram_single_poller_preserved') is not True:
                        raise SystemExit('single poller boundary changed')
                    PY
                    grep -F 'T4_TELEGRAM=NOT_TESTED' android-node/verify-phone-bridge-secure.sh
          YML

          cat > .github/workflows/android-node-ci.yml <<'YML'
          name: Android node safety checks

          on:
            pull_request:
              paths: ['android-node/**', '.github/workflows/android-node-ci.yml']
            push:
              branches: [feat/openclaw-android-node-absorber]
              paths: ['android-node/**', '.github/workflows/android-node-ci.yml']
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
                  with:
                    node-version: '22.23.2'
                - name: Reproduce committed dependency graph
                  shell: bash
                  run: |
                    set -euo pipefail
                    for dir in android-node/adb-mcp android-node/codex-phone-mcp android-node/phone-codex-cli-backend; do
                      (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
                    done
                    node --check android-node/adb-mcp/server.mjs
                    node --check android-node/codex-phone-mcp/server.mjs
                - name: Validate compatibility delegates and action allowlist
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash -n android-node/install-pi-android-node.sh
                    bash -n android-node/enable-phone-write-lane.sh
                    bash -n android-node/disable-phone-write-lane.sh
                    grep -F 'bootstrap-all.sh' android-node/install-pi-android-node.sh
                    grep -F 'enable-phone-write.sh' android-node/enable-phone-write-lane.sh
                    grep -F 'disable-phone-write.sh' android-node/disable-phone-write-lane.sh
                    grep -F 'phone_open_bridge_app' android-node/adb-mcp/server.mjs
                    grep -F 'phone_key' android-node/adb-mcp/server.mjs
                    ! grep -E 'phone_(launch_url|tap|swipe|type_text)' android-node/adb-mcp/server.mjs
          YML

      - name: Commit repaired workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/android-phone-absorber-ci.yml \
            .github/workflows/android-live-gates-ci.yml \
            .github/workflows/android-node-ci.yml
          if git diff --cached --quiet; then
            echo 'CI files already match the current hardened contract.'
          else
            git commit -m 'fix: align Android CI with hardened production contract'
            git push origin HEAD:${TARGET_BRANCH}
          fi

      - name: Report repair
        shell: bash
        run: |
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body 'CI repair v2 applied: stale checks expecting removed generic phone controls or obsolete immutable references were replaced with the current hardened contract. PR remains Draft pending physical T3 and existing-Telegram T4.'
