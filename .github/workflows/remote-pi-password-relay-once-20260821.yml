name: Remote Pi password relay once

on:
  push:
    branches:
      - ops/remote-pi-password-relay-20260821-r4
    paths:
      - .github/workflows/remote-pi-password-relay-once-20260821.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-pi-password-relay-once-20260821-r4
  cancel-in-progress: false

jobs:
  remote-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-oidc-pi-password-relay-broker-once-20260821-r4
      OIDC_AUDIENCE: odi-pi-password-relay-20260821-r4
      RECOVERY_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/pi-auth-repair-and-resume-verified-20260821
      RECOVERY_BYTES: "18109"
      RECOVERY_SHA256: a54d5f3d35fc4808962df9da64f318e86b81d205bef27d07abc20f7febf66a3d
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Exchange GitHub OIDC for encrypted one-time credentials
        id: broker
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/relay-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/relay-private.pem -pubout -outform DER -out /tmp/relay-public.der
          PUBLIC_SPKI_B64="$(base64 -w0 /tmp/relay-public.der)"

          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          unset OIDC_JSON

          python3 - "$PUBLIC_SPKI_B64" >/tmp/broker-body.json <<'PY'
          import json,sys
          print(json.dumps({"public_spki_b64":sys.argv[1]},separators=(",",":")))
          PY

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'content-type: application/json' \
            --data-binary @/tmp/broker-body.json \
            "$BROKER_URL" \
            -o /tmp/broker-response.json
          unset OIDC_TOKEN PUBLIC_SPKI_B64

          python3 - <<'PY'
          import base64,json,pathlib
          data=json.loads(pathlib.Path('/tmp/broker-response.json').read_text())
          if data.get('ok') is not True:
              raise SystemExit('broker_response_not_ok')
          for field,target in (
              ('encrypted_auth_key_b64','/tmp/auth-key.bin'),
              ('encrypted_pi_password_b64','/tmp/pi-password.bin'),
          ):
              pathlib.Path(target).write_bytes(base64.b64decode(data[field],validate=True))
          safe={
              'candidates':data.get('candidates',[]),
              'lan_target':data.get('lan_target'),
              'pi_user':data.get('pi_user'),
              'hostname':data.get('hostname'),
              'recipient_public_spki_sha256':data.get('recipient_public_spki_sha256'),
              'secret_values_included':False,
          }
          pathlib.Path('/tmp/broker-safe.json').write_text(json.dumps(safe,separators=(',',':')))
          PY

          openssl pkeyutl -decrypt \
            -inkey /tmp/relay-private.pem \
            -in /tmp/auth-key.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/tailscale-auth-key
          openssl pkeyutl -decrypt \
            -inkey /tmp/relay-private.pem \
            -in /tmp/pi-password.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/pi-password

          AUTHKEY="$(cat /tmp/tailscale-auth-key)"
          PI_PASSWORD="$(cat /tmp/pi-password)"
          CANDIDATES="$(python3 -c 'import json; print(" ".join(json.load(open("/tmp/broker-safe.json"))["candidates"]))')"
          LAN_TARGET="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["lan_target"])')"
          PI_USER="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["pi_user"])')"
          TS_HOSTNAME="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["hostname"])')"

          [[ "$AUTHKEY" == tskey-auth-* ]]
          [[ ${#PI_PASSWORD} -ge 8 ]]
          echo "::add-mask::$AUTHKEY"
          echo "::add-mask::$PI_PASSWORD"
          {
            echo "authkey=$AUTHKEY"
            echo "pi_password=$PI_PASSWORD"
            echo "candidates=$CANDIDATES"
            echo "lan_target=$LAN_TARGET"
            echo "pi_user=$PI_USER"
            echo "hostname=$TS_HOSTNAME"
          } >> "$GITHUB_OUTPUT"

          rm -f /tmp/relay-private.pem /tmp/relay-public.der /tmp/auth-key.bin /tmp/pi-password.bin \
            /tmp/tailscale-auth-key /tmp/pi-password /tmp/broker-response.json /tmp/broker-body.json

      - name: Join the authorized Tailnet ephemerally
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ steps.broker.outputs.authkey }}
          hostname: ${{ steps.broker.outputs.hostname }}
          statedir: /tmp/tailscale-state/
          use-cache: 'true'
          version: 1.82.0
          timeout: 2m
          retry: 5

      - name: Prepare bounded SSH recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p artifacts
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 2 --retry-delay 2 \
            "$RECOVERY_URL" -o /tmp/pi-auth-repair.sh
          test "$(wc -c < /tmp/pi-auth-repair.sh | tr -d ' ')" = "$RECOVERY_BYTES"
          test "$(sha256sum /tmp/pi-auth-repair.sh | awk '{print $1}')" = "$RECOVERY_SHA256"
          bash -n /tmp/pi-auth-repair.sh
          chmod 700 /tmp/pi-auth-repair.sh

      - name: Locate Pi directly or through a live Linux relay
        id: route
        shell: bash
        env:
          PI_PASSWORD: ${{ steps.broker.outputs.pi_password }}
          CANDIDATES: ${{ steps.broker.outputs.candidates }}
          LAN_TARGET: ${{ steps.broker.outputs.lan_target }}
          PI_USER: ${{ steps.broker.outputs.pi_user }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$PI_PASSWORD"
          : > artifacts/probe-results.log
          MODE=""
          TARGET=""
          ACCESS_USER=""
          RELAY_IP=""
          RELAY_USER=""

          safe_probe='MODEL=unknown; if [ -r /proc/device-tree/model ]; then MODEL=$(tr -d "\000" </proc/device-tree/model | tr -cd "A-Za-z0-9 ._/-" | head -c 100); fi; OC=false; if command -v openclaw >/dev/null 2>&1 || [ -f "$HOME/.openclaw/openclaw.json" ]; then OC=true; fi; LAN=false; if timeout 4 bash -lc "</dev/tcp/192.168.0.47/22" >/dev/null 2>&1; then LAN=true; fi; printf "SAFE host=%s user=%s arch=%s model=%s openclaw=%s lan=%s\n" "$(hostname | tr -cd "A-Za-z0-9._-")" "$(id -un | tr -cd "A-Za-z0-9._-")" "$(uname -m | tr -cd "A-Za-z0-9._/-")" "$MODEL" "$OC" "$LAN"'

          for candidate in $CANDIDATES; do
            timeout 20s tailscale ping --c 2 --timeout 6s "$candidate" >/dev/null 2>&1 || continue
            for user in "$PI_USER" pi ubuntu; do
              INFO="$(timeout 25s sshpass -e ssh \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile=/tmp/known_hosts \
                -o ConnectTimeout=7 \
                -o NumberOfPasswordPrompts=1 \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=password,keyboard-interactive \
                "${user}@${candidate}" "$safe_probe" 2>/dev/null || true)"
              [[ -n "$INFO" ]] || continue
              printf '%s target=%s login=%s\n' "$INFO" "$candidate" "$user" >> artifacts/probe-results.log
              if grep -Eq 'openclaw=true|model=.*Raspberry' <<<"$INFO"; then
                MODE=direct
                TARGET="$candidate"
                ACCESS_USER="$user"
                break 2
              fi
              if grep -q 'lan=true' <<<"$INFO" && [[ -z "$RELAY_IP" ]]; then
                RELAY_IP="$candidate"
                RELAY_USER="$user"
              fi
            done
          done

          if [[ -z "$MODE" && -n "$RELAY_IP" ]]; then
            cat >/tmp/relay-proxy.sh <<'PROXY'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/tmp/relay_known_hosts \
            -o ConnectTimeout=7 \
            -o NumberOfPasswordPrompts=1 \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            "${RELAY_USER}@${RELAY_IP}" -W "$1:$2"
          PROXY
            chmod 700 /tmp/relay-proxy.sh
            export RELAY_IP RELAY_USER
            for user in "$PI_USER" pi ubuntu; do
              INFO="$(timeout 35s sshpass -e ssh \
                -o ProxyCommand='/tmp/relay-proxy.sh %h %p' \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile=/tmp/pi_known_hosts \
                -o ConnectTimeout=10 \
                -o NumberOfPasswordPrompts=1 \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=password,keyboard-interactive \
                "${user}@${LAN_TARGET}" "$safe_probe" 2>/dev/null || true)"
              [[ -n "$INFO" ]] || continue
              printf '%s target=%s login=%s relay=%s\n' "$INFO" "$LAN_TARGET" "$user" "$RELAY_IP" >> artifacts/probe-results.log
              MODE=relay
              TARGET="$LAN_TARGET"
              ACCESS_USER="$user"
              break
            done
          fi

          if [[ -z "$MODE" ]]; then
            printf '{"result":"blocked","reason":"no_authenticated_direct_or_relay_path","secret_values_included":false}\n' > artifacts/route-result.json
            cat artifacts/probe-results.log || true
            exit 20
          fi

          {
            echo "mode=$MODE"
            echo "target=$TARGET"
            echo "access_user=$ACCESS_USER"
            echo "relay_ip=$RELAY_IP"
            echo "relay_user=$RELAY_USER"
          } >> "$GITHUB_OUTPUT"
          printf '{"result":"ready","mode":"%s","target":"%s","secret_values_included":false}\n' "$MODE" "$TARGET" > artifacts/route-result.json
          echo "REMOTE_PATH_FOUND mode=$MODE"

      - name: Execute fixed Pi authentication repair and recovery
        shell: bash
        env:
          PI_PASSWORD: ${{ steps.broker.outputs.pi_password }}
          MODE: ${{ steps.route.outputs.mode }}
          TARGET: ${{ steps.route.outputs.target }}
          ACCESS_USER: ${{ steps.route.outputs.access_user }}
          RELAY_IP: ${{ steps.route.outputs.relay_ip }}
          RELAY_USER: ${{ steps.route.outputs.relay_user }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$PI_PASSWORD"
          if [[ "$MODE" == direct ]]; then
            timeout 2100s sshpass -e ssh \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              -o ConnectTimeout=10 \
              -o NumberOfPasswordPrompts=1 \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password,keyboard-interactive \
              "${ACCESS_USER}@${TARGET}" 'bash -s' \
              < /tmp/pi-auth-repair.sh \
              | tee artifacts/remote-safe-output.log
          else
            export RELAY_IP RELAY_USER
            timeout 2100s sshpass -e ssh \
              -o ProxyCommand='/tmp/relay-proxy.sh %h %p' \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/pi_known_hosts \
              -o ConnectTimeout=12 \
              -o NumberOfPasswordPrompts=1 \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password,keyboard-interactive \
              "${ACCESS_USER}@${TARGET}" 'bash -s' \
              < /tmp/pi-auth-repair.sh \
              | tee artifacts/remote-safe-output.log
          fi

      - name: Collect secret-free completion summary
        if: always()
        shell: bash
        env:
          PI_PASSWORD: ${{ steps.broker.outputs.pi_password }}
          MODE: ${{ steps.route.outputs.mode }}
          TARGET: ${{ steps.route.outputs.target }}
          ACCESS_USER: ${{ steps.route.outputs.access_user }}
          RELAY_IP: ${{ steps.route.outputs.relay_ip }}
          RELAY_USER: ${{ steps.route.outputs.relay_user }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          export SSHPASS="$PI_PASSWORD"
          READ_CMD='python3 - <<'"'"'PY'"'"'
          import json
          from pathlib import Path
          paths=[
            Path.home()/".openclaw/receipts/pi-auth-repair-20260821.json",
            Path.home()/".openclaw/receipts/full-recovery-dispatcher-20260821.json",
            Path.home()/".openclaw/receipts/resume-recovery-20260821.json",
            Path.home()/".openclaw/runtime/pi-model-route-finalizer-receipt.json",
          ]
          out={"secret_values_included":False,"receipts":[]}
          for path in paths:
            row={"path":str(path),"present":path.is_file()}
            if path.is_file():
              try:
                data=json.loads(path.read_text(encoding="utf-8"))
                if data.get("secret_values_included") is True:
                  row["state"]="blocked_secret_boundary"
                else:
                  row.update({"state":"present","result":data.get("result"),"blocker":data.get("blocker"),"correlation_id":data.get("correlation_id"),"gateway_rpc_ok":data.get("gateway_rpc_ok") if "gateway_rpc_ok" in data else (data.get("gateway") or {}).get("rpc") if isinstance(data.get("gateway"),dict) else None,"primary":(data.get("after") or {}).get("primary") if isinstance(data.get("after"),dict) else (data.get("model") or {}).get("primary") if isinstance(data.get("model"),dict) else None,"telegram_outbound_sent":data.get("telegram_outbound_sent")})
              except Exception as exc:
                row["state"]="invalid_"+type(exc).__name__
            out["receipts"].append(row)
          print(json.dumps(out,ensure_ascii=False,separators=(",",":")))
          PY'

          if [[ -n "${MODE:-}" && -n "${TARGET:-}" && -n "${ACCESS_USER:-}" ]]; then
            if [[ "$MODE" == direct ]]; then
              timeout 90s sshpass -e ssh \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts \
                -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1 -o PubkeyAuthentication=no \
                -o PreferredAuthentications=password,keyboard-interactive \
                "${ACCESS_USER}@${TARGET}" "$READ_CMD" > artifacts/remote-summary.json || true
            else
              export RELAY_IP RELAY_USER
              timeout 90s sshpass -e ssh \
                -o ProxyCommand='/tmp/relay-proxy.sh %h %p' \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/pi_known_hosts \
                -o ConnectTimeout=12 -o NumberOfPasswordPrompts=1 -o PubkeyAuthentication=no \
                -o PreferredAuthentications=password,keyboard-interactive \
                "${ACCESS_USER}@${TARGET}" "$READ_CMD" > artifacts/remote-summary.json || true
            fi
          fi
          cat artifacts/route-result.json 2>/dev/null || true
          cat artifacts/remote-summary.json 2>/dev/null || true
          unset PI_PASSWORD SSHPASS
          rm -f /tmp/pi-auth-repair.sh /tmp/relay-proxy.sh /tmp/known_hosts /tmp/relay_known_hosts /tmp/pi_known_hosts

      - name: Upload secret-free recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-pi-password-relay-evidence
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 3
          overwrite: false