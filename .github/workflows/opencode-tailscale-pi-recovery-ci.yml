name: OpenCode and Tailscale Pi recovery checks

on:
  pull_request:
    paths:
      - 'pi/activate-opencode-tailscale.sh'
      - 'pi/recover-opencode-first-tailscale-second.sh'
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/functions/pi-model-gateway-guardian/**'
      - 'supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql'
      - 'supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'
      - 'supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'
      - '.github/workflows/opencode-tailscale-pi-recovery-ci.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'pi/activate-opencode-tailscale.sh'
      - 'pi/recover-opencode-first-tailscale-second.sh'
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/functions/pi-model-gateway-guardian/**'
      - 'supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql'
      - 'supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'
      - 'supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'
      - '.github/workflows/opencode-tailscale-pi-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate shell and Edge syntax
        shell: bash
        run: |
          bash -n pi/activate-opencode-tailscale.sh
          bash -n pi/recover-opencode-first-tailscale-second.sh
          deno check supabase/functions/pi-infra-bootstrap/index.ts
          deno check supabase/functions/pi-model-gateway-guardian/index.ts

      - name: Validate scoped recovery and cloud contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path('pi/activate-opencode-tailscale.sh').read_text(encoding='utf-8')
          wrapper = Path('pi/recover-opencode-first-tailscale-second.sh').read_text(encoding='utf-8')
          edge = Path('supabase/functions/pi-infra-bootstrap/index.ts').read_text(encoding='utf-8')
          guardian = Path('supabase/functions/pi-model-gateway-guardian/index.ts').read_text(encoding='utf-8')
          config = Path('supabase/functions/pi-infra-bootstrap/config.toml').read_text(encoding='utf-8')
          seed = Path('supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql').read_text(encoding='utf-8')
          promote = Path('supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql').read_text(encoding='utf-8')
          correction = Path('supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql').read_text(encoding='utf-8')

          assert 'recover-opencode-first-tailscale-second.sh' in legacy
          assert 'exec "$CANONICAL" "$@"' in legacy

          wrapper_required = (
              'pi-recovery-installer-verified',
              '4c21d9eab6fff335950f8a4c8c7a064a20b9aa00aead487b811cee779e8ae947',
              "--proto '=https'",
              'sha256sum --check --status',
              'INSTALLER_SHA256_MISMATCH',
              'PI_REFRESH_TOKEN',
              'agents.defaults.model',
              'provider_secret_returned',
              'RECOVERY_MODE=SUPABASE_GUARDIAN_SCOPED_PI_JWT',
              'SECOND_TELEGRAM_POLLER=false',
              'PAID_API_FALLBACK=false',
          )
          for needle in wrapper_required:
              assert needle in wrapper, needle

          edge_required = (
              'Opencode-api-key',
              'Tailscale-fff-api-key',
              'pi-gateway-client',
              'MAX_BOOTSTRAPS_PER_HOUR',
              'refreshSession',
              'bridge_request_ledger',
              'authenticated_pi_only',
              'https://opencode.ai/zen/v1/models',
              'pi-model-gateway-guardian/v1',
              'include_tailscale_auth_key',
              'deliverTailscaleAuthKey',
              'node_auth_key',
              'export_original_provider_key_to_pi: false',
              'start_second_telegram_poller: false',
              'surface_raw_provider_error_to_telegram: false',
              'provider_secret_returned: false',
              'values_logged: false',
          )
          for needle in edge_required:
              assert needle in edge, needle
          assert 'verify_jwt = false' in config

          guardian_required = (
              'const MAX_ATTEMPTS = 2',
              'async function requirePi',
              'async function queueRequest',
              '요청을 안전하게 보존했습니다',
              'provider_secret_returned: false',
          )
          for needle in guardian_required:
              assert needle in guardian, needle

          for needle in (
              'bridge_model_health',
              'claim_openclaw_recovery_task',
              'pi_model_gateway_guardian_e2e',
              'pi_recovery_queue_api_e2e',
          ):
              assert needle in seed, needle

          for needle in (
              "gate_key='pi_model_gateway_guardian_e2e'",
              "gate_key='pi_recovery_queue_api_e2e'",
              "component_key='edge.pi-model-gateway-guardian'",
              "component_key='edge.token-gateway'",
              "lifecycle_status='compatibility'",
              "'supabase.opencode_model_guardian'",
              "mode='disabled'",
          ):
              assert needle in promote, needle

          for needle in (
              "validation_status = 'unverified'",
              'Actual expiry, revocation and enrollment usability remain unverified',
              "health_status = 'not_tested'",
              'physical tailscale up receipt',
          ):
              assert needle in correction, needle
          PY

      - name: Reject embedded secrets and obsolete direct-provider routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('pi/activate-opencode-tailscale.sh'),
              Path('pi/recover-opencode-first-tailscale-second.sh'),
              Path('supabase/functions/pi-infra-bootstrap/index.ts'),
              Path('supabase/functions/pi-model-gateway-guardian/index.ts'),
              Path('supabase/migrations/202608200001_openclaw_guardian_reconciliation.sql'),
              Path('supabase/migrations/202608200002_promote_openclaw_guardian_after_e2e.sql'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          scripts = '\n'.join(path.read_text(encoding='utf-8') for path in paths[:2])

          forbidden_patterns = {
              'OpenRouter secret literal': r'sk-or-v1-[A-Za-z0-9_-]{8,}',
              'OpenAI secret literal': r'sk-proj-[A-Za-z0-9_-]{8,}',
              'Tailscale secret literal': r'tskey-(?:auth|api|client)-[A-Za-z0-9_-]{8,}',
              'Bearer credential literal': r'Bearer\s+[A-Za-z0-9._~-]{20,}',
              'Telegram token assignment': r'TELEGRAM_BOT_TOKEN=',
              'second poller primitive': r'(?:getUpdates|start_polling|run_polling)\(',
          }
          for label, pattern in forbidden_patterns.items():
              assert re.search(pattern, text) is None, label

          assert 'OPENCODE_API_KEY=' not in scripts
          assert 'TAILSCALE_AUTHKEY=' not in scripts
          assert 'opencode/nemotron-3-ultra-free' not in scripts
          assert 'curl ' in scripts
          assert '| bash' not in scripts
          assert 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' not in scripts
          PY
