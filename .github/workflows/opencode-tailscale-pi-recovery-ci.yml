name: OpenCode and Tailscale Pi recovery checks

on:
  pull_request:
    paths:
      - 'pi/activate-opencode-tailscale.sh'
      - 'pi/recover-opencode-first-tailscale-second.sh'
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/migrations/20260819210608_activate_opencode_tailscale_and_harden_model_routes.sql'
      - 'supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql'
      - '.github/workflows/opencode-tailscale-pi-recovery-ci.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'pi/activate-opencode-tailscale.sh'
      - 'pi/recover-opencode-first-tailscale-second.sh'
      - 'supabase/functions/pi-infra-bootstrap/**'
      - 'supabase/migrations/20260819210608_activate_opencode_tailscale_and_harden_model_routes.sql'
      - 'supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql'
      - '.github/workflows/opencode-tailscale-pi-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n pi/activate-opencode-tailscale.sh
          bash -n pi/recover-opencode-first-tailscale-second.sh

      - name: Validate recovery and cloud contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path('pi/activate-opencode-tailscale.sh').read_text(encoding='utf-8')
          model_first = Path('pi/recover-opencode-first-tailscale-second.sh').read_text(encoding='utf-8')
          edge = Path('supabase/functions/pi-infra-bootstrap/index.ts').read_text(encoding='utf-8')
          config = Path('supabase/functions/pi-infra-bootstrap/config.toml').read_text(encoding='utf-8')
          migration = Path('supabase/migrations/20260819210608_activate_opencode_tailscale_and_harden_model_routes.sql').read_text(encoding='utf-8')
          correction = Path('supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql').read_text(encoding='utf-8')

          common_required = (
              'pi-auth-refresh',
              'pi-infra-bootstrap',
              'opencode/nemotron-3-ultra-free',
              'opencode/deepseek-v4-flash-free',
              'opencode/mimo-v2.5-free',
              'agents.defaults.model',
              'agents.entries.$AGENT_ID.model',
              'tailscale up',
              '--auth-key="$TAILSCALE_AUTHKEY"',
              '--ssh',
              'openclaw config validate',
              'openclaw gateway restart',
              'providerOverride',
              'modelOverrideSource',
              'second_telegram_poller_created',
              'paid_api_fallback_enabled',
          )
          for script in (legacy, model_first):
              for needle in common_required:
                  assert needle in script, needle
              assert 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' not in script

          for needle in (
              'Model recovery is now committed. Tailscale is independent and best-effort.',
              'CONFIG_BACKUP=""',
              'SESSION_BACKUP=""',
              'TAILSCALE_STATUS="auth_key_rejected_or_expired"',
              'RESULT=MODEL_VERIFIED',
              'model_verified_tailscale_pending',
              'rm -f "$SECRETS_TEMP"',
          ):
              assert needle in model_first, needle

          model_commit = model_first.index('MODEL_VERIFIED=true')
          tailscale_attempt = model_first.index('try_tailscale()')
          assert model_commit < tailscale_attempt

          edge_required = (
              'Opencode-api-key',
              'Tailscale-fff-api-key',
              'pi-gateway-client',
              'MAX_BOOTSTRAPS_PER_HOUR',
              'bridge_request_ledger',
              'authenticated_pi_only',
              'https://opencode.ai/zen/v1/models',
              'node_auth_key',
              'cacheable: false',
              'values_logged: false',
          )
          for needle in edge_required:
              assert needle in edge, needle
          assert 'verify_jwt = true' in config

          migration_required = (
              'opencode_zen_free_route',
              'tailscale_node_enrollment',
              "'openrouter_free_route', false",
              "'local_ollama_route', false",
              'opencode/nemotron-3-ultra-free',
              'opencode/deepseek-v4-flash-free',
              'telegram-model-session-unpin-v1',
              "r.health_status in ('healthy', 'degraded')",
              'revoke all on function public.bridge_resolve_route',
          )
          for needle in migration_required:
              assert needle in migration, needle
          assert "local_http' and r.health_status='unknown" not in migration

          for needle in (
              "validation_status = 'unverified'",
              'Actual expiry, revocation and enrollment usability remain unverified',
              "health_status = 'not_tested'",
              'physical tailscale up receipt',
          ):
              assert needle in correction, needle
          PY

      - name: Reject embedded secrets and unsafe execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('pi/activate-opencode-tailscale.sh'),
              Path('pi/recover-opencode-first-tailscale-second.sh'),
              Path('supabase/functions/pi-infra-bootstrap/index.ts'),
              Path('supabase/migrations/20260819210608_activate_opencode_tailscale_and_harden_model_routes.sql'),
              Path('supabase/migrations/20260819212129_mark_tailscale_node_key_pending_pi_verification.sql'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)

          forbidden_patterns = {
              'OpenRouter literal': r'sk-or-v1-[A-Za-z0-9_-]{8,}',
              'OpenAI literal': r'sk-proj-[A-Za-z0-9_-]{8,}',
              'Tailscale literal': r'tskey-(?:auth|api|client)-[A-Za-z0-9_-]{8,}',
              'Bearer literal': r'Bearer\s+[A-Za-z0-9._~-]{20,}',
              'Telegram token assignment': r'TELEGRAM_BOT_TOKEN=',
              'second poller primitive': r'(?:getUpdates|start_polling|run_polling)\(',
          }
          for label, pattern in forbidden_patterns.items():
              assert re.search(pattern, text) is None, label

          for path in paths[:2]:
              compact = re.sub(r'\s+', '', path.read_text(encoding='utf-8')).lower()
              assert '"paid_api_fallback_enabled":true' not in compact
              assert '"paid_api_fallback_requested":true' not in compact
          PY
