name: Stop bounded overnight absorber

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  stop-when-expired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_PR: '2'
      STOP_AT_UTC: '2026-08-19T06:40:00Z'
    steps:
      - name: Disable the bounded workflows after the fixed stop time
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          stop="$(date -u -d "$STOP_AT_UTC" +%s)"
          if (( now < stop )); then
            echo "ACTIVE_UNTIL=$STOP_AT_UTC"
            exit 0
          fi

          gh api -X PUT "repos/$REPO/actions/workflows/overnight-android-absorber.yml/disable" || true
          gh api -X PUT "repos/$REPO/actions/workflows/overnight-android-absorber-stop.yml/disable" || true
          gh pr comment "$TARGET_PR" --repo "$REPO" --body "The fixed overnight validation window closed at $STOP_AT_UTC. Both scheduled workflows were disabled. No root/jailbreak, paid-model call, credential mutation, merge, deployment, or physical-device action was performed by these workflows." || true
          echo 'OVERNIGHT_WORKFLOWS_DISABLED=1'
