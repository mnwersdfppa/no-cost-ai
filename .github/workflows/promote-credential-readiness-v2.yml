name: Promote credential readiness v2

on:
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'supabase/functions/deployed/final-v2/credential-readiness/index.ts'
      - '.github/workflows/promote-credential-readiness-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-credential-readiness-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/supabase-emergency-bridge-20260819
          fetch-depth: 1
          persist-credentials: true

      - name: Promote corrected source
        shell: bash
        run: |
          set -euo pipefail
          source_file='supabase/functions/deployed/final-v2/credential-readiness/index.ts'
          test -s "$source_file"
          cp "$source_file" supabase/functions/deployed/final-v1/credential-readiness/index.ts
          cp "$source_file" supabase/functions/credential-readiness/index.ts

          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('supabase/functions/deployed/final-v1/credential-readiness/index.ts'),
              Path('supabase/functions/credential-readiness/index.ts'),
          ):
              text=path.read_text()
              required=(
                  'recordRuntimeKeySelection(user.id)',
                  'if (admission.duplicate)',
                  'runtime_server_key_type',
                  'values_returned: false',
              )
              for item in required:
                  if item not in text:
                      raise SystemExit(f'{path}: missing {item}')
              if text.index('recordRuntimeKeySelection(user.id)') > text.index('if (admission.duplicate)'):
                  raise SystemExit(f'{path}: runtime receipt occurs after duplicate return')
          PY

      - name: Commit promoted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/deployed/final-v1/credential-readiness/index.ts \
            supabase/functions/credential-readiness/index.ts
          if git diff --cached --quiet; then
            echo 'PROMOTION=NO_CHANGES'
          else
            git commit -m 'fix: retain runtime receipt across duplicate readiness calls'
            git push origin HEAD:feat/supabase-emergency-bridge-20260819
          fi
