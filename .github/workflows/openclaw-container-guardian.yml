name: OpenClaw container compatibility guardian

on:
  pull_request:
    branches:
      - main
    paths:
      - 'container/openclaw-compat-guardian/**'
      - 'pi/install-openclaw-container-guardian.sh'
      - 'pi/install-openclaw-docker-compat.sh'
      - 'supabase/functions/pi-container-bootstrap/**'
      - '.github/workflows/openclaw-container-guardian.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'container/openclaw-compat-guardian/**'
      - 'pi/install-openclaw-container-guardian.sh'
      - 'pi/install-openclaw-docker-compat.sh'
      - 'supabase/functions/pi-container-bootstrap/**'
      - '.github/workflows/openclaw-container-guardian.yml'
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Publish mutable edge and commit candidate tags after all validation jobs pass'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: openclaw-container-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: docker.io/odifool/openclaw-compat
  RELEASE_TAG: '2026.08.20'
  RELEASE_DIGEST: sha256:6c6df789c26cb0400171818fb0903d27ff799f9642d6e8c2eaf2b1c8e2e2894b
  RELEASE_IMAGE: docker.io/odifool/openclaw-compat@sha256:6c6df789c26cb0400171818fb0903d27ff799f9642d6e8c2eaf2b1c8e2e2894b
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-compat-guardian
  CONTEXT: container/openclaw-compat-guardian
  BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/docker-publisher-broker
  BROKER_AUDIENCE: supabase-openclaw-docker-publisher

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Record immutable source hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "$CONTEXT/guardian.py" \
            "$CONTEXT/self_test.py" \
            "$CONTEXT/Dockerfile" \
            "$CONTEXT/check_oci.py" \
            "$CONTEXT/compose.yaml" \
            "$CONTEXT/.dockerignore" \
            | tee /tmp/source-sha256.txt

      - name: Compile and validate guardian
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$CONTEXT/guardian.py" \
            "$CONTEXT/self_test.py" \
            "$CONTEXT/check_oci.py"
          python3 "$CONTEXT/self_test.py"
          docker buildx build --check "$CONTEXT"

      - name: Build and execute native source image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag openclaw-compat-guardian:test \
            "$CONTEXT"
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 64 \
            --memory 256m \
            --network none \
            --entrypoint python3 \
            openclaw-compat-guardian:test \
            /opt/openclaw-compat-guardian/self_test.py

      - name: Build multi-platform OCI archive
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --provenance=false \
            --output type=oci,dest=/tmp/openclaw-compat-guardian.oci.tar \
            "$CONTEXT"
          python3 "$CONTEXT/check_oci.py" \
            /tmp/openclaw-compat-guardian.oci.tar \
            --max-compressed-mb 180 \
            --receipt /tmp/oci-compatibility-receipt.json

      - name: Upload source compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-container-source-compatibility-${{ github.sha }}
          path: |
            /tmp/source-sha256.txt
            /tmp/oci-compatibility-receipt.json
          if-no-files-found: error
          retention-days: 14

  verify-published-image:
    name: Verify published ${{ matrix.platform }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            expected_uname: x86_64
          - platform: linux/arm64
            expected_uname: aarch64
    steps:
      - name: Set up QEMU for foreign architecture execution
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Pull immutable release digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "$RELEASE_IMAGE"

      - name: Execute hardened status probe
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --pull never \
            --platform "${{ matrix.platform }}" \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 64 \
            --memory 128m \
            --cpus 0.5 \
            "$RELEASE_IMAGE" status \
            | tee /tmp/openclaw-compat-status.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('/tmp/openclaw-compat-status.json').read_text(encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('container_arch') == os.environ['EXPECTED_UNAME']
          assert data.get('container_os') == 'alpine'
          assert data.get('network_required') is False
          assert data.get('docker_socket_required') is False
          assert data.get('secret_values_included') is False
          PY
        env:
          EXPECTED_UNAME: ${{ matrix.expected_uname }}

      - name: Verify non-root and read-only isolation
        shell: bash
        run: |
          set -euo pipefail
          user_value="$(docker image inspect --format '{{.Config.User}}' "$RELEASE_IMAGE")"
          test "$user_value" = '65532:65532'
          docker run --rm \
            --pull never \
            --platform "${{ matrix.platform }}" \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 64 \
            --memory 128m \
            --entrypoint /bin/sh \
            "$RELEASE_IMAGE" \
            -ec 'test "$(id -u)" != 0; if touch /rootfs-write-test 2>/dev/null; then exit 41; fi'

      - name: Reject credential material in runtime environment
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --pull never \
            --platform "${{ matrix.platform }}" \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /bin/sh \
            "$RELEASE_IMAGE" \
            -ec 'if env | grep -E "^(OPENAI|OPENROUTER|OPENCODE|TELEGRAM|TAILSCALE|DOCKER.*TOKEN|SUPABASE_SERVICE_ROLE)="; then exit 42; fi'

      - name: Record immutable execution receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              'image': os.environ['RELEASE_IMAGE'],
              'release_tag': os.environ['RELEASE_TAG'],
              'digest': os.environ['RELEASE_DIGEST'],
              'platform': os.environ['PLATFORM'],
              'expected_uname': os.environ['EXPECTED_UNAME'],
              'status_probe': 'pass',
              'non_root': True,
              'read_only_rootfs': True,
              'network': 'none',
              'docker_socket_mounted': False,
              'provider_secret_present': False,
              'telegram_poller_present': False,
              'secret_values_included': False,
          }
          Path('/tmp/published-image-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_UNAME: ${{ matrix.expected_uname }}

      - name: Upload published-image receipt
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-published-image-${{ matrix.expected_uname }}-${{ github.sha }}
          path: /tmp/published-image-receipt.json
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true
    needs:
      - validate-source
      - verify-published-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Login to GHCR with repository token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm multi-platform build cache before requesting publisher token
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=cacheonly
          provenance: false

      - name: Exchange GitHub OIDC for scoped Docker Hub registry token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY' > /tmp/github-oidc-url
          import os
          import urllib.parse

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          parts = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(('audience', os.environ['BROKER_AUDIENCE']))
          print(urllib.parse.urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urllib.parse.urlencode(query),
              parts.fragment,
          )))
          PY
          oidc_url="$(cat /tmp/github-oidc-url)"
          curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url" \
            -o /tmp/github-oidc-response.json
          oidc_token="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/github-oidc-response.json', encoding='utf-8'))['value'])
          PY
          )"
          echo "::add-mask::$oidc_token"
          curl -fsS \
            -H "Authorization: Bearer $oidc_token" \
            -H 'content-type: application/json' \
            -H 'user-agent: github-openclaw-container-publisher/2' \
            --data '{"action":"issue_repository_token"}' \
            "$BROKER_URL" \
            -o /tmp/docker-publisher-response.json
          python3 - <<'PY'
          import json
          import pathlib

          response_path = pathlib.Path('/tmp/docker-publisher-response.json')
          data = json.loads(response_path.read_text(encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('image') == 'docker.io/odifool/openclaw-compat'
          assert data.get('auth_config_mode') == 'identitytoken'
          assert data.get('docker_pat_returned') is False
          assert data.get('provider_secret_returned') is False
          assert data.get('short_lived_registry_token_returned') is True
          assert sorted(data.get('actions', [])) == ['pull', 'push']
          token = data.get('identity_token')
          assert isinstance(token, str) and len(token) > 20
          print(f'::add-mask::{token}')
          config_path = pathlib.Path.home() / '.docker' / 'config.json'
          config_path.parent.mkdir(parents=True, exist_ok=True)
          try:
              config = json.loads(config_path.read_text(encoding='utf-8'))
          except (FileNotFoundError, json.JSONDecodeError):
              config = {}
          config.setdefault('auths', {})['https://index.docker.io/v1/'] = {
              'username': data['username'],
              'identitytoken': token,
          }
          config_path.write_text(json.dumps(config, separators=(',', ':')) + '\n', encoding='utf-8')
          config_path.chmod(0o600)
          response_path.write_text(json.dumps({
              'ok': True,
              'image': data['image'],
              'expires_at': data['expires_at'],
              'actions': data['actions'],
              'identity_token_removed': True,
              'docker_pat_returned': False,
              'secret_values_included': False,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -f /tmp/github-oidc-url /tmp/github-oidc-response.json

      - name: Build and push mutable candidate tags
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:edge
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:edge
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.openclaw.supported-platforms=linux/amd64,linux/arm64
            io.openclaw.provider-secret-included=false
            io.openclaw.second-telegram-poller=false
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Inspect pushed candidate manifests
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$DOCKER_IMAGE@$DIGEST" | tee /tmp/dockerhub-image-manifest.txt
          docker buildx imagetools inspect "$GHCR_IMAGE@$DIGEST" | tee /tmp/ghcr-image-manifest.txt
          for manifest in /tmp/dockerhub-image-manifest.txt /tmp/ghcr-image-manifest.txt; do
            grep -Fq 'linux/amd64' "$manifest"
            grep -Fq 'linux/arm64' "$manifest"
          done

      - name: Remove short-lived Docker Hub token material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          path = pathlib.Path.home() / '.docker' / 'config.json'
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  data = {}
              auths = data.get('auths')
              if isinstance(auths, dict):
                  auths.pop('https://index.docker.io/v1/', None)
              path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
              path.chmod(0o600)
          for name in (
              '/tmp/docker-publisher-response.json',
              '/tmp/github-oidc-response.json',
              '/tmp/github-oidc-url',
          ):
              pathlib.Path(name).unlink(missing_ok=True)
          PY
