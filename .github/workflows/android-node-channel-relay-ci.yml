name: Android Channel Relay CI

on:
  pull_request:
    paths:
      - 'android-node/channel-relay/**'
      - 'android-node/*channel-relay.sh'
      - 'android-node/auto-complete.sh'
      - 'go.sh'
      - '.github/workflows/android-node-channel-relay-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shell syntax
        run: |
          bash -n go.sh
          bash -n android-node/install-channel-relay.sh
          bash -n android-node/enable-channel-relay.sh
          bash -n android-node/disable-channel-relay.sh
          bash -n android-node/auto-complete.sh
          bash -n android-node/rollback-all.sh
      - name: Relay syntax
        working-directory: android-node/channel-relay
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Secret and unrestricted-shell guard
        run: |
          set -euo pipefail
          ! grep -RInE --exclude='*.md' --exclude='package-lock.json' '(sk-proj-|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' android-node/channel-relay android-node/*channel-relay.sh android-node/auto-complete.sh go.sh
          ! grep -RInE --exclude='*.md' '(adb[^\n]*shell[^\n]*(rm -rf|su\b|settings put|pm uninstall)|execFile\([^,]+,[^\n]*prompt)' android-node/channel-relay android-node/*channel-relay.sh android-node/auto-complete.sh
