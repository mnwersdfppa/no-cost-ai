name: Android Node Absorber CI

on:
  pull_request:
    paths:
      - 'android-node/**'
      - '.github/workflows/android-node-absorber-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/**'
      - '.github/workflows/android-node-absorber-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            android-node/adb-mcp/package.json
            android-node/codex-phone-mcp/package.json

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find android-node -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate package metadata and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for dir in android-node/adb-mcp android-node/codex-phone-mcp; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$dir/package.json"
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund && npm run check)
          done

      - name: Reject embedded secret-like values
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' --exclude='package-lock.json' '(sk-proj-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' android-node; then
            echo 'Secret-like literal detected.' >&2
            exit 1
          fi

      - name: Confirm high-risk primitives are absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' '(adb[^\n]*shell[^\n]*(rm -rf|su\b|settings put|pm uninstall|am force-stop)|sendTextMessage|ACTION_CALL|ACTION_DIAL)' android-node; then
            echo 'High-risk primitive detected.' >&2
            exit 1
          fi

      - name: Summarize packet
        shell: bash
        run: |
          printf 'scripts=%s\n' "$(find android-node -maxdepth 1 -name '*.sh' | wc -l)"
          printf 'mcp_servers=%s\n' "$(find android-node -mindepth 2 -maxdepth 2 -name 'server.mjs' | wc -l)"
