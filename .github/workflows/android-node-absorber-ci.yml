name: Android Node Absorber CI

on:
  pull_request:
    paths:
      - 'android-node/**'
      - '.github/workflows/android-node-absorber-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/**'
      - '.github/workflows/android-node-absorber-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find android-node -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate package metadata and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for dir in android-node/adb-mcp android-node/codex-phone-mcp; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$dir/package.json"
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund && npm run check)
          done
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' android-node/phone-codex-cli-backend/package.json
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' android-node/phone-codex-cli-backend/openclaw.plugin.json

      - name: Reject embedded secret-like values
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' --exclude='package-lock.json' '(sk-proj-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' android-node; then
            echo 'Secret-like literal detected.' >&2
            exit 1
          fi

      - name: Confirm high-risk primitives are absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' '(adb[^\n]*shell[^\n]*(rm -rf|su\b|settings put|pm uninstall|am force-stop)|sendTextMessage|ACTION_CALL|ACTION_DIAL|PHONE_RELAY_ENABLED|openclaw[^\n]*mcp[^\n]*serve)' android-node; then
            echo 'High-risk or duplicate-channel primitive detected.' >&2
            exit 1
          fi

      - name: Confirm forced-command SSH and API-key stripping
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'restrict,command=' android-node/phone-termux-bootstrap.sh
          grep -F 'DENIED=COMMAND_NOT_ALLOWLISTED' android-node/phone-termux-bootstrap.sh
          grep -F -- '-u OPENAI_API_KEY' android-node/phone-codex-cli-backend/phone-codex-cli-backend.sh
          grep -F 'StrictHostKeyChecking=yes' android-node/phone-codex-cli-backend/phone-codex-cli-backend.sh

      - name: Summarize packet
        shell: bash
        run: |
          printf 'scripts=%s\n' "$(find android-node -type f -name '*.sh' | wc -l)"
          printf 'mcp_servers=%s\n' "$(find android-node -mindepth 2 -maxdepth 2 -name 'server.mjs' | wc -l)"
          printf 'cli_backend_plugins=%s\n' "$(find android-node -name 'openclaw.plugin.json' | wc -l)"
