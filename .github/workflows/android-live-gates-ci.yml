name: Android immutable live-gate checks

on:
  pull_request:
    paths:
      - 'android-node/**'
      - '.github/workflows/android-live-gates-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/**'
      - '.github/workflows/android-live-gates-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate secure wrapper syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            android-node/bootstrap-all.sh \
            android-node/install-pi-bridge-secure.sh \
            android-node/install-verified-codex-termux.sh \
            android-node/phone-termux-bootstrap-secure.sh \
            android-node/verify-phone-bridge-secure.sh \
            android-node/rollback-pi-phone-absorber-secure.sh; do
            bash -n "$file"
          done
      - name: Verify immutable bootstrap and reviewed Codex package
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=android-node/bootstrap-all.sh
          readme=android-node/README.md
          installer=android-node/install-verified-codex-termux.sh
          grep -Fq 'IMMUTABLE_PHONE_ABSORBER_COMMIT_REQUIRED' "$bootstrap"
          grep -Eq '\^\[0-9a-fA-F\]\{40\}\$' "$bootstrap"
          grep -Fq 'checkout --quiet --detach --force FETCH_HEAD' "$bootstrap"
          grep -Fq 'install-pi-bridge-secure.sh' "$bootstrap"
          grep -Fq 'verify-phone-bridge-secure.sh' "$bootstrap"
          ! grep -Eq '(PHONE_ABSORBER_REF|origin/\$REF|--branch[[:space:]]+\$REF)' "$bootstrap"
          grep -Fq 'PHONE_ABSORBER_COMMIT=ff1f0b77d2a997bd5ef0b21d847eb2a31819ecdc' "$readme"
          grep -Fq '/ff1f0b77d2a997bd5ef0b21d847eb2a31819ecdc/android-node/bootstrap-all.sh' "$readme"
          grep -Fq 'EXPECTED_VERSION="0.146.0"' "$installer"
          grep -Fq 'sha512-yG3sPWNda/2YAIQIDq9MrrjoCTIQ7rxYM5IasrG3VBcuhCLTkgeg/JzqmJq1V98RE4MJ5jCxDXXQlOjrditFRw==' "$installer"
          grep -Fq '082252be01f29dff4b7b7b14ceb6e103a7df7777' "$installer"
          grep -Fq 'npm pack "@openai/codex@$EXPECTED_VERSION"' "$installer"
          grep -Fq 'npm install -g "$ARCHIVE"' "$installer"
          ! grep -Eq 'npm install -g "?@openai/codex@\$CODEX_VERSION"?' "$installer"
      - name: Verify secure phone packet and key cardinality gates
        shell: bash
        run: |
          set -euo pipefail
          pi=android-node/install-pi-bridge-secure.sh
          phone=android-node/phone-termux-bootstrap-secure.sh
          verify=android-node/verify-phone-bridge-secure.sh
          rollback=android-node/rollback-pi-phone-absorber-secure.sh
          grep -Fq 'openclaw-phone-bootstrap-core.sh' "$pi"
          grep -Fq 'openclaw-install-codex-verified.sh' "$pi"
          grep -Fq 'phone-termux-bootstrap-secure.sh' "$pi"
          grep -Fq 'len(lines)!=1' "$phone"
          grep -Fq "parts[0] != 'ssh-ed25519'" "$phone"
          grep -Fq 'PINNED_SSH_HOST_KEY_RECORD_COUNT_INVALID' "$verify"
          grep -Fq 'PINNED_SSH_HOST_KEY_NOT_ED25519' "$verify"
          grep -Fq 'TARGET_ALREADY_PRIMARY_WITHOUT_VALID_ROLLBACK_RECORD' "$verify"
          grep -Fq 'PRIMARY_MODEL_PROMOTION_NOT_VERIFIED' "$verify"
          grep -Fq 't4_telegram_round_trip' "$verify"
          grep -Fq 'ROLLBACK_PRIMARY_NOT_RESTORED' "$rollback"
          grep -Fq 'ROLLED_BACK_VERIFIED' "$rollback"
      - name: Reject mutable or prohibited live-path primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' '(raw.githubusercontent.com/.*/(main|master|feat/)|git[[:space:]]+reset[[:space:]]+--hard.*origin/|PHONE_ABSORBER_REF|curl[^\n]*\|[[:space:]]*(bash|sh))' android-node; then
            echo 'Mutable live-path primitive detected' >&2
            exit 1
          fi
          if grep -RInE --exclude='*.md' '(Magisk|fastboot[[:space:]]+flashing|bootloader[[:space:]]+unlock|adb[[:space:]]+root|su[[:space:]]+-c)' android-node; then
            echo 'Root or bootloader primitive detected' >&2
            exit 1
          fi
