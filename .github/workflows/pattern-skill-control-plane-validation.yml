name: Validate canonical pattern-to-skill control plane

on:
  pull_request:
    paths:
      - 'docs/pattern-to-skill-evolution-system.md'
      - 'supabase/functions/pattern-observation-intake/**'
      - 'supabase/functions/pattern-skill-readiness/**'
      - 'supabase/functions/deployment-manifest-pattern-skill.json'
      - 'supabase/migrations/20260820003000_pattern_to_skill_schema.sql'
      - 'supabase/migrations/20260820003100_pattern_to_skill_functions.sql'
      - 'supabase/migrations/20260820003200_pattern_to_skill_seed_schedule.sql'
      - 'supabase/migrations/20260820003300_repair_canonical_pattern_sweep.sql'
      - 'supabase/migrations/20260820003400_suppress_redundant_pattern_research.sql'
      - '.github/workflows/pattern-skill-control-plane-validation.yml'
  push:
    branches:
      - feat/supabase-emergency-bridge-20260819
    paths:
      - 'docs/pattern-to-skill-evolution-system.md'
      - 'supabase/functions/pattern-observation-intake/**'
      - 'supabase/functions/pattern-skill-readiness/**'
      - 'supabase/functions/deployment-manifest-pattern-skill.json'
      - 'supabase/migrations/20260820003000_pattern_to_skill_schema.sql'
      - 'supabase/migrations/20260820003100_pattern_to_skill_functions.sql'
      - 'supabase/migrations/20260820003200_pattern_to_skill_seed_schedule.sql'
      - 'supabase/migrations/20260820003300_repair_canonical_pattern_sweep.sql'
      - 'supabase/migrations/20260820003400_suppress_redundant_pattern_research.sql'
      - '.github/workflows/pattern-skill-control-plane-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-pattern-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check retired compatibility endpoints
        run: |
          set -euo pipefail
          deno check supabase/functions/pattern-observation-intake/index.ts
          deno check supabase/functions/pattern-skill-readiness/index.ts
          grep -F 'retired_use_openclaw_pattern_engine_observe' supabase/functions/pattern-observation-intake/index.ts
          grep -F 'retired_use_openclaw_pattern_engine_status' supabase/functions/pattern-skill-readiness/index.ts

      - name: Validate canonical deployment manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('supabase/functions/deployment-manifest-pattern-skill.json')
              .read_text(encoding='utf-8')
          )

          assert data['project_id'] == 'dpllasnpfskyyyzebyal'
          assert data['canonical_storage'] == 'supabase'
          architecture = data['canonical_pattern_architecture']
          assert architecture['operational_observations'] == 'openclaw_pattern_observations'
          assert architecture['operational_candidates'] == 'openclaw_pattern_candidates'
          assert architecture['canonical_api'] == 'openclaw-pattern-engine'
          assert architecture['single_candidate_authority'] is True
          assert data['functions']['openclaw-pattern-engine']['arbitrary_execution_allowed'] is False
          assert data['functions']['pattern-observation-intake']['status'] == 'RETIRED_410'
          assert data['functions']['pattern-skill-readiness']['status'] == 'RETIRED_410'

          scheduler = data['scheduler']
          assert scheduler['canonical_sweep_job']['schedule'] == '19 * * * *'
          assert scheduler['canonical_sweep_job']['metadata_only_promotion'] is True
          assert scheduler['canonical_sweep_job']['external_fetch'] is False
          assert scheduler['research_housekeeping_job']['schedule'] == '24 * * * *'
          assert scheduler['research_housekeeping_job']['paid_api'] is False

          verified = data['verified_state']
          assert verified['operational_patterns'] == 15
          assert verified['patterns_synced'] == 15
          assert verified['skills_synced'] == 15
          assert verified['internal_catalog_tasks_completed'] == 13
          assert verified['redundant_external_tasks_suppressed'] == 52
          assert verified['research_tasks_queued'] == 0
          assert verified['research_tasks_failed'] == 0
          assert verified['external_api_calls_for_research'] == 0
          assert verified['paid_api_calls_for_research'] == 0

          research = data['research']
          assert research['search_before_build'] is True
          assert research['internal_catalog_first'] is True
          assert research['automatic_code_execution'] is False

          notion = data['notion_migration']
          assert notion['migration_state'] == 'verified'
          assert notion['active_items_copied'] == 7
          assert notion['completed_items_retained'] == 3
          assert notion['source_retained'] is True
          assert notion['automatic_source_delete'] is False
          assert notion['automatic_source_archive'] is False
          assert notion['secret_migration'] is False

          docker = data['docker_compatibility']
          assert docker['anonymous_public_pull'] is True
          assert docker['digest_verified'] is True
          assert docker['non_root_verified'] is True
          assert docker['entrypoint_verified'] is True
          assert docker['image_contains_credentials'] is False
          assert sorted(docker['platforms']) == ['linux/amd64', 'linux/arm64']

          github = data['credential_selection']['github']
          assert github['edge_fallback_alias'] == 'Github-api-delicate-key'
          assert github['broad_alias_selected'] is False
          assert data['credential_selection']['notion']['users_me_read_contract'] == 'PASS'

          security = data['security']
          for key in (
              'secret_values_included',
              'automatic_credential_scope_increase',
              'automatic_paid_api',
              'automatic_merge',
              'production_deployment',
              'second_telegram_poller',
              'hidden_infrastructure',
              'unauthorized_access',
              'jailbreak_or_safeguard_bypass',
          ):
              assert security[key] is False, key
          print('canonical_manifest=pass')
          PY

      - name: Validate schema, sweep and research deduplication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = {
              name: Path(name).read_text(encoding='utf-8')
              for name in (
                  'supabase/migrations/20260820003000_pattern_to_skill_schema.sql',
                  'supabase/migrations/20260820003100_pattern_to_skill_functions.sql',
                  'supabase/migrations/20260820003200_pattern_to_skill_seed_schedule.sql',
                  'supabase/migrations/20260820003300_repair_canonical_pattern_sweep.sql',
                  'supabase/migrations/20260820003400_suppress_redundant_pattern_research.sql',
              )
          }
          schema = paths['supabase/migrations/20260820003000_pattern_to_skill_schema.sql']
          functions = paths['supabase/migrations/20260820003100_pattern_to_skill_functions.sql']
          sweep = paths['supabase/migrations/20260820003300_repair_canonical_pattern_sweep.sql']
          housekeeping = paths['supabase/migrations/20260820003400_suppress_redundant_pattern_research.sql']

          for table in (
              'bridge_pattern_observations',
              'bridge_pattern_candidates',
              'bridge_research_queue',
              'bridge_solution_catalog',
              'bridge_skill_registry',
              'bridge_skill_versions',
              'bridge_skill_evaluations',
              'bridge_automation_runs',
              'bridge_source_bindings',
              'bridge_capability_registry',
          ):
              assert f'create table if not exists public.{table}' in schema, table

          assert 'enable row level security' in schema.lower()
          assert 'secret_values_included boolean not null default false' in schema.lower()
          assert 'unique(skill_key,execution_key)' in schema.lower()
          assert 'bridge_skill_gate_status' in functions
          assert 'v_success_runs>=3' in functions
          assert 'v_failed_runs=0' in functions

          for marker in (
              'openclaw_harvest_operational_patterns',
              'openclaw_refresh_pattern_scores',
              'bridge_sync_openclaw_pattern_engine',
              'bridge_process_internal_research_tasks',
              "'trace-to-pattern-feedback'",
              "'reuse-first-solution-composer'",
              "'metadata_only_promotion',true",
              "'external_fetch_performed',false",
              "'arbitrary_code_execution',false",
          ):
              assert marker in sweep, marker

          for marker in (
              'bridge_suppress_redundant_external_research_tasks',
              "provider<>'internal_catalog'",
              "'external_api_called',false",
              "'paid_api_used',false",
              "'openclaw-pattern-research-housekeeping-v1'",
              "'24 * * * *'",
          ):
              assert marker in housekeeping, marker
          print('schema_sweep_housekeeping=pass')
          PY

      - name: Reject arbitrary execution and secret literals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('supabase/functions/pattern-observation-intake/index.ts'),
              Path('supabase/functions/pattern-skill-readiness/index.ts'),
              Path('supabase/migrations/20260820003000_pattern_to_skill_schema.sql'),
              Path('supabase/migrations/20260820003100_pattern_to_skill_functions.sql'),
              Path('supabase/migrations/20260820003200_pattern_to_skill_seed_schedule.sql'),
              Path('supabase/migrations/20260820003300_repair_canonical_pattern_sweep.sql'),
              Path('supabase/migrations/20260820003400_suppress_redundant_pattern_research.sql'),
          ]
          combined = '\n'.join(path.read_text(encoding='utf-8') for path in files)

          for pattern in (
              r'Deno\.Command\s*\(',
              r'new\s+Function\s*\(',
              r'\beval\s*\(',
              r'getUpdates',
              r'curl\s*\|\s*(?:sh|bash)',
              r'sk-proj-[A-Za-z0-9_-]{20,}',
              r'ghp_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'xox[baprs]-[A-Za-z0-9-]{20,}',
              r'tskey-(?:auth|api|client)-[A-Za-z0-9_-]{20,}',
              r'dckr_(?:pat|oat)_[A-Za-z0-9_-]{20,}',
          ):
              assert re.search(pattern, combined, re.IGNORECASE) is None, pattern
          print('execution_secret_boundary=pass')
          PY

      - name: Confirm non-production workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pattern-skill-control-plane-validation.yml').read_text(encoding='utf-8')
          for marker in (
              'supabase functions ' + 'deploy',
              'vercel ' + '--prod',
              'gh pr ' + 'merge',
              'git push ' + 'origin main',
              'contents: write',
          ):
              assert marker not in workflow, marker
          assert 'contents: read' in workflow
          assert 'persist-credentials: false' in workflow
          print('production_mutation=off')
          PY
