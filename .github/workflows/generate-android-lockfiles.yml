name: Generate Android bridge lockfiles

on:
  workflow_dispatch:
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/*/package.json'
      - '.github/workflows/generate-android-lockfiles.yml'

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/openclaw-android-node-absorber
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Generate deterministic bridge lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            android-node/adb-mcp \
            android-node/codex-phone-mcp \
            android-node/phone-codex-cli-backend; do
            (
              cd "$dir"
              rm -f package-lock.json
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --ignore-scripts --no-audit --no-fund
            )
          done
      - name: Generate Linux ARM64 Termux Codex lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd android-node/codex-termux-runtime
          rm -f package-lock.json
          npm_config_platform=linux npm_config_arch=arm64 \
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm_config_platform=linux npm_config_arch=arm64 \
            npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          test -x node_modules/@openai/codex-linux-arm64/vendor/aarch64-unknown-linux-musl/bin/codex
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const root = lock.packages?.['']?.dependencies ?? {};
          if (root['@openai/codex'] !== '0.146.0') throw new Error('Codex root version drift');
          if (root['@openai/codex-linux-arm64'] !== '0.146.0') throw new Error('Codex ARM64 version drift');
          for (const name of ['node_modules/@openai/codex','node_modules/@openai/codex-linux-arm64']) {
            const item = lock.packages?.[name];
            if (!item || item.version !== '0.146.0' || !item.integrity || !item.resolved) {
              throw new Error(`Incomplete locked artifact metadata: ${name}`);
            }
          }
          NODE
      - name: Verify lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for file in android-node/*/package-lock.json; do
            test -s "$file"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done
      - name: Commit lockfiles to the isolated feature branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-node/adb-mcp/package-lock.json \
            android-node/codex-phone-mcp/package-lock.json \
            android-node/phone-codex-cli-backend/package-lock.json \
            android-node/codex-termux-runtime/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
          else
            git commit -m 'build: commit reviewed Android bridge lockfiles'
            git push origin HEAD:feat/openclaw-android-node-absorber
          fi
      - name: Upload lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-bridge-lockfiles
          path: |
            android-node/adb-mcp/package-lock.json
            android-node/codex-phone-mcp/package-lock.json
            android-node/phone-codex-cli-backend/package-lock.json
            android-node/codex-termux-runtime/package-lock.json
          if-no-files-found: error
          retention-days: 1
