name: Remote Pi auth repair once

on:
  push:
    branches:
      - ops/remote-pi-auth-repair-20260821-r2
    paths:
      - .github/workflows/remote-pi-auth-repair-once-20260821.yml
      - pi/pi-auth-repair-and-resume-20260821.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-pi-auth-repair-once-20260821-r2
  cancel-in-progress: false

jobs:
  remote-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery bundle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify local recovery script
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=pi/pi-auth-repair-and-resume-20260821.sh
          test "$(wc -c < "$SCRIPT" | tr -d ' ')" = "18109"
          test "$(sha256sum "$SCRIPT" | awk '{print $1}')" = "a54d5f3d35fc4808962df9da64f318e86b81d205bef27d07abc20f7febf66a3d"
          bash -n "$SCRIPT"

      - name: Exchange GitHub OIDC for one-time Tailscale node key
        id: broker
        shell: bash
        env:
          BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-oidc-tailscale-broker-once-20260821-r2
          OIDC_AUDIENCE: odi-pi-recovery-20260821-r2
        run: |
          set -Eeuo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          unset OIDC_JSON
          RESPONSE="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'content-type: application/json' \
            --data '{}' \
            "$BROKER_URL")"
          unset OIDC_TOKEN
          AUTHKEY="$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; print(d["auth_key"])' <<<"$RESPONSE")"
          TARGET="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["target_ip"])' <<<"$RESPONSE")"
          SSH_USER="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ssh_user"])' <<<"$RESPONSE")"
          HOSTNAME="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["hostname"])' <<<"$RESPONSE")"
          unset RESPONSE
          echo "::add-mask::$AUTHKEY"
          {
            echo "authkey=$AUTHKEY"
            echo "target=$TARGET"
            echo "ssh_user=$SSH_USER"
            echo "hostname=$HOSTNAME"
          } >> "$GITHUB_OUTPUT"

      - name: Join the authorized Tailnet ephemerally
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ steps.broker.outputs.authkey }}
          hostname: ${{ steps.broker.outputs.hostname }}
          statedir: /tmp/tailscale-state/
          use-cache: 'true'

      - name: Find a direct Pi or an existing Linux relay
        id: path
        shell: bash
        env:
          EXPECTED_PI_IP: ${{ steps.broker.outputs.target }}
          PI_USER: ${{ steps.broker.outputs.ssh_user }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          tailscale status --json > /tmp/ts-status.json
          python3 - "$EXPECTED_PI_IP" /tmp/ts-status.json > /tmp/peer-candidates <<'PY'
          import json,sys
          expected=sys.argv[1]
          data=json.load(open(sys.argv[2],encoding='utf-8'))
          values=[]
          if expected:
              values.append(expected)
          peers=data.get('Peer',{})
          if isinstance(peers,dict):
              for peer in peers.values():
                  if not isinstance(peer,dict) or peer.get('OS')!='linux' or peer.get('Online') is False:
                      continue
                  ips=peer.get('TailscaleIPs') or []
                  if isinstance(ips,list):
                      values.extend(ip for ip in ips if isinstance(ip,str) and '.' in ip)
          seen=set()
          for value in values:
              if value not in seen:
                  print(value)
                  seen.add(value)
          PY

          MODE=""
          PEER=""
          ACCESS_USER=""
          for candidate in $(cat /tmp/peer-candidates); do
            timeout 15s tailscale ping --c 1 --timeout 5s "$candidate" >/dev/null 2>&1 || continue
            for user in "$PI_USER" pi ubuntu root; do
              INFO="$(timeout 20s tailscale ssh "${user}@${candidate}" 'OC=false; if command -v openclaw >/dev/null 2>&1 || test -f "$HOME/.openclaw/openclaw.json"; then OC=true; fi; LAN=false; if timeout 4 bash -lc "</dev/tcp/192.168.0.47/22" >/dev/null 2>&1; then LAN=true; fi; printf "ARCH=%s OC=%s LAN=%s\n" "$(uname -m)" "$OC" "$LAN"' 2>/dev/null || true)"
              [[ -n "$INFO" ]] || continue
              if grep -q 'OC=true' <<<"$INFO"; then
                MODE=direct
                PEER="$candidate"
                ACCESS_USER="$user"
                break 2
              fi
              if grep -q 'LAN=true' <<<"$INFO"; then
                if timeout 25s tailscale ssh "${user}@${candidate}" \
                  "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=7 ${PI_USER}@192.168.0.47 'printf PI_LAN_SSH_OK'" \
                  >/dev/null 2>&1; then
                  MODE=relay
                  PEER="$candidate"
                  ACCESS_USER="$user"
                  break 2
                fi
              fi
            done
          done

          if [[ -z "$MODE" ]]; then
            printf '{"result":"blocked","reason":"no_direct_or_relay_path","secret_values_included":false}\n' > artifacts/path-result.json
            echo 'REMOTE_PATH_NOT_FOUND direct=false relay=false' >&2
            exit 20
          fi
          {
            echo "mode=$MODE"
            echo "peer=$PEER"
            echo "access_user=$ACCESS_USER"
          } >> "$GITHUB_OUTPUT"
          printf '{"result":"ready","mode":"%s","secret_values_included":false}\n' "$MODE" > artifacts/path-result.json
          echo "REMOTE_PATH_FOUND mode=$MODE"

      - name: Execute Pi authentication repair and resume recovery
        shell: bash
        env:
          MODE: ${{ steps.path.outputs.mode }}
          PEER: ${{ steps.path.outputs.peer }}
          ACCESS_USER: ${{ steps.path.outputs.access_user }}
          PI_USER: ${{ steps.broker.outputs.ssh_user }}
        run: |
          set -Eeuo pipefail
          if [[ "$MODE" == direct ]]; then
            timeout 2100s tailscale ssh "${ACCESS_USER}@${PEER}" 'bash -s' \
              < pi/pi-auth-repair-and-resume-20260821.sh \
              | tee /tmp/pi-auth-repair-safe-output.log
          elif [[ "$MODE" == relay ]]; then
            base64 -w0 pi/pi-auth-repair-and-resume-20260821.sh \
              | timeout 2100s tailscale ssh "${ACCESS_USER}@${PEER}" \
                "base64 -d | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ${PI_USER}@192.168.0.47 'bash -s'" \
              | tee /tmp/pi-auth-repair-safe-output.log
          else
            exit 21
          fi

      - name: Upload secret-free recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-pi-auth-repair-relay-evidence
          path: |
            artifacts/*
            /tmp/pi-auth-repair-safe-output.log
          if-no-files-found: warn
          retention-days: 3
