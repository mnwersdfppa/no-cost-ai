name: Physical PC bridge once 20260823

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: physical-pc-bridge-main-once-20260823
  cancel-in-progress: false

env:
  BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-oidc-physical-pc-bridge-main-once-20260823
  OIDC_AUDIENCE: odi-physical-pc-bridge-main-20260823
  PC_SCRIPT_URL: https://raw.githubusercontent.com/mnwersdfppa/no-cost-ai/00a1f2a8c04f6b44f7ef26108943410e5ad84692/scripts/Prepare-OpenClaw-PC-Primary.ps1

jobs:
  physical-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Open encrypted exact-IP one-shot bridge
        id: bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p artifacts
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/k.pem >/dev/null 2>&1
          openssl pkey -in /tmp/k.pem -pubout -outform DER -out /tmp/k.der
          SPKI="$(base64 -w0 /tmp/k.der)"
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          python3 - "$SPKI" >/tmp/body.json <<'PY'
          import json,sys
          print(json.dumps({'mode':'open','public_spki_b64':sys.argv[1]},separators=(',',':')))
          PY
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' --data-binary @/tmp/body.json "$BROKER_URL" -o /tmp/broker.json
          python3 - <<'PY'
          import base64,json,pathlib
          d=json.load(open('/tmp/broker.json'))
          if d.get('ok') is not True: raise SystemExit('broker_not_open')
          pathlib.Path('/tmp/key.bin').write_bytes(base64.b64decode(d['encrypted_auth_key_b64'],validate=True))
          safe={k:v for k,v in d.items() if k!='encrypted_auth_key_b64'}
          pathlib.Path('/tmp/bridge-safe.json').write_text(json.dumps(safe,separators=(',',':')))
          pathlib.Path('artifacts/bridge-open-safe.json').write_text(json.dumps(safe,separators=(',',':'))+'\n')
          PY
          openssl pkeyutl -decrypt -inkey /tmp/k.pem -in /tmp/key.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/auth
          AUTH="$(cat /tmp/auth)"
          [[ "$AUTH" == tskey-auth-* ]]
          echo "::add-mask::$AUTH"
          echo "authkey=$AUTH" >> "$GITHUB_OUTPUT"
          rm -f /tmp/k.pem /tmp/k.der /tmp/key.bin /tmp/auth /tmp/body.json /tmp/broker.json

      - name: Join tailnet ephemerally
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ steps.bridge.outputs.authkey }}
          hostname: odi-physical-pc-bridge-${{ github.run_id }}
          statedir: /tmp/tailscale-state/
          version: 1.102.3
          timeout: 2m
          retry: 3
          use-cache: false

      - name: Directly probe SSH 22 and execute pinned Windows preflight through verified WSL only
        id: physical
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          : > artifacts/physical-probe.log
          : > artifacts/windows-execution.log
          python3 - <<'PY' >/tmp/targets.tsv
          import json
          for x in json.load(open('/tmp/bridge-safe.json')).get('targets',[]):
              print(x.get('address',''),x.get('hostname',''),sep='\t')
          PY
          cat >/tmp/run.ps1 <<'PS'
          $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
          $tmp=Join-Path $env:TEMP ('Prepare-OpenClaw-PC-Primary-'+[Guid]::NewGuid().ToString('N')+'.ps1')
          try {
            Invoke-WebRequest -UseBasicParsing $env:ODI_PC_SCRIPT_URL -OutFile $tmp
            & $tmp
            $p=Join-Path $env:USERPROFILE '.openclaw\receipts\pc-primary-preflight-v1.json'
            if(-not(Test-Path $p)){throw 'PC_PRIMARY_RECEIPT_MISSING'}
            $r=Get-Content -Raw $p|ConvertFrom-Json
            [ordered]@{marker='WINDOWS_PHYSICAL_PC_PRIMARY_RECEIPT';result=[string]$r.result;completed_at=[string]$r.completed_at;openclaw_cli_present=[bool]$r.openclaw_cli_present;openclaw_installed_now=[bool]$r.openclaw_installed_now;doctor_exit_code=$r.doctor_exit_code;gateway_status_exit_code=$r.gateway_status_exit_code;openclaw_native_cron_disabled=[bool]$r.openclaw_native_cron_disabled;n8n_sole_operational_scheduler_required=[bool]$r.n8n_sole_operational_scheduler_required;telegram_poller_created=[bool]$r.telegram_poller_created;host_rebooted=[bool]$r.host_rebooted;secret_values_included=$false}|ConvertTo-Json -Compress
          } finally {Remove-Item -Force $tmp -ErrorAction SilentlyContinue}
          PS
          B64="$(python3 -c 'import base64,pathlib;print(base64.b64encode(pathlib.Path("/tmp/run.ps1").read_text().encode("utf-16le")).decode())')"
          PROBE='set -eu; MODEL=unknown; [ ! -r /proc/device-tree/model ] || MODEL=$(tr -d "\000" </proc/device-tree/model | tr -cd "A-Za-z0-9 ._/-" | head -c 120); WSL=false; grep -Eqi "microsoft|wsl" /proc/sys/kernel/osrelease /proc/version 2>/dev/null && WSL=true || true; WINPS=false; [ ! -x /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe ] || WINPS=true; OC=false; command -v openclaw >/dev/null 2>&1 && OC=true || [ ! -f "$HOME/.openclaw/openclaw.json" ] || OC=true; printf "SAFE host=%s user=%s arch=%s model=%s wsl=%s windows_powershell=%s openclaw=%s\n" "$(hostname|tr -cd "A-Za-z0-9._-")" "$(id -un|tr -cd "A-Za-z0-9._-")" "$(uname -m|tr -cd "A-Za-z0-9._/-")" "$MODEL" "$WSL" "$WINPS" "$OC"'
          EXECUTED=false; TARGET=''; LOGIN=''; PI5=false; SSH_RESPONDED=false
          while IFS=$'\t' read -r ip hint; do
            [[ "$ip" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            for u in mnwersdfppap mnwersdfppa pi ubuntu admin root; do
              set +e
              INFO="$(timeout 25s tailscale ssh "$u@$ip" "$PROBE" 2>/tmp/ssh.err)"
              RC=$?
              set -e
              if [[ $RC -ne 0 || -z "$INFO" ]]; then
                printf 'SSH_BLOCKED target=%s login=%s rc=%s\n' "$ip" "$u" "$RC" >> artifacts/physical-probe.log
                continue
              fi
              SSH_RESPONDED=true
              printf '%s target=%s login=%s hint=%s\n' "$INFO" "$ip" "$u" "$hint" >> artifacts/physical-probe.log
              grep -Eqi 'model=Raspberry Pi 5' <<<"$INFO" && PI5=true || true
              if grep -Eqi 'wsl=true.*windows_powershell=true' <<<"$INFO"; then
                CMD="export ODI_PC_SCRIPT_URL=$(printf '%q' "$PC_SCRIPT_URL"); /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $(printf '%q' "$B64")"
                O="$(timeout 10m tailscale ssh "$u@$ip" "$CMD" 2>&1 || true)"
                printf '%s\n' "$O" > artifacts/windows-execution.log
                if grep -q 'WINDOWS_PHYSICAL_PC_PRIMARY_RECEIPT' <<<"$O" && grep -q 'pc_primary_preflight_complete' <<<"$O"; then EXECUTED=true; TARGET="$ip"; LOGIN="$u"; break 2; fi
              fi
            done
          done </tmp/targets.tsv
          python3 - "$EXECUTED" "$TARGET" "$LOGIN" "$PI5" "$SSH_RESPONDED" > artifacts/summary.json <<'PY'
          import json,sys,datetime
          print(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'windows_physical_preflight_executed':sys.argv[1].lower()=='true','target_used':sys.argv[2] or None,'login_used':sys.argv[3] or None,'raspberry_pi5_detected':sys.argv[4].lower()=='true','any_target_ssh_responded':sys.argv[5].lower()=='true','host_rebooted':False,'data_deleted':False,'second_telegram_poller_created':False,'secret_values_included':False},separators=(',',':')))
          PY
          echo "executed=$EXECUTED" >> "$GITHUB_OUTPUT"
          rm -f /tmp/targets.tsv /tmp/run.ps1 /tmp/ssh.err
          [[ "$EXECUTED" == true ]]

      - name: Close bridge and revoke key
        if: always() && steps.bridge.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' --data '{"mode":"cleanup"}' "$BROKER_URL" | tee artifacts/bridge-cleanup-safe.json
          rm -f /tmp/bridge-safe.json

      - name: Upload secret-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-pc-bridge-evidence-${{ github.run_id }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce physical receipt
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.physical.outputs.executed }}" == "true" ]] || { echo PHYSICAL_WINDOWS_EXECUTION_NOT_ATTESTED; exit 1; }
          echo PHYSICAL_WINDOWS_EXECUTION_ATTESTED
