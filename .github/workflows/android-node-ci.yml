name: Android node safety checks

on:
  pull_request:
    paths:
      - 'android-node/**'
      - 'pi/**'
      - '.github/workflows/android-node-ci.yml'
  push:
    branches:
      - feat/openclaw-android-node-absorber
    paths:
      - 'android-node/**'
      - 'pi/**'
      - '.github/workflows/android-node-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install MCP dependencies without lifecycle scripts
        working-directory: android-node/adb-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript and Python syntax
        run: |
          node --check android-node/adb-mcp/server.mjs
          python3 -m py_compile pi/pi-work-queue-worker.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            android-node/install-pi-android-node.sh \
            android-node/enable-phone-write-lane.sh \
            android-node/disable-phone-write-lane.sh \
            pi/install-work-queue-timer.sh \
            pi/install-maton-readonly-oauth.sh \
            pi/remove-maton-readonly-oauth.sh \
            pi/check-make-readonly.sh \
            pi/check-n8n-readonly.sh \
            pi/bootstrap-mobile-automation-safe.sh; do
            bash -n "$script"
          done
      - name: Check for committed secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude='package-lock.json' \
            --exclude='pi-work-queue-worker.py' \
            '(sk-proj-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
            android-node pi; then
            echo 'Potential secret detected' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('pi/pi-work-queue-worker.py').read_text(encoding='utf-8')
          filtered = '\n'.join(line for line in text.splitlines() if 're.compile(' not in line)
          patterns = [
              r'sk-proj-[A-Za-z0-9_-]{20,}',
              r'sk-[A-Za-z0-9_-]{20,}',
              r'ghp_[A-Za-z0-9]{20,}',
              r'xox[baprs]-[A-Za-z0-9-]{20,}',
              r'AKIA[0-9A-Z]{16}',
              r'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY',
          ]
          hits = [pattern for pattern in patterns if re.search(pattern, filtered)]
          if hits:
              raise SystemExit('Potential worker secret literal: ' + ', '.join(hits))
          PY
      - name: Verify write-gate and task-scoped tool invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "PHONE_WRITE_ENABLED === '1'" android-node/adb-mcp/server.mjs
          grep -Fq "phone_open_bridge_app" android-node/adb-mcp/server.mjs
          grep -Fq "z.enum(['openclaw', 'termux'])" android-node/adb-mcp/server.mjs
          grep -Fq "phone_key" android-node/adb-mcp/server.mjs
          grep -Fq "phone_open_bridge_app" android-node/enable-phone-write-lane.sh
          for forbidden in phone_launch_url phone_tap phone_swipe phone_type_text phone_open_app adb_shell; do
            if grep -RIn --exclude='*.md' --exclude='package-lock.json' "$forbidden" android-node/adb-mcp android-node/enable-phone-write-lane.sh; then
              echo "Forbidden generic phone tool found: $forbidden" >&2
              exit 1
            fi
          done
          ! grep -Eq "child_process.*exec\(" android-node/adb-mcp/server.mjs
      - name: Verify Maton OAuth is discovery-only
        shell: bash
        run: |
          set -euo pipefail
          file=pi/install-maton-readonly-oauth.sh
          grep -Fq 'https://mcp.maton.ai' "$file"
          grep -Fq '"auth": "oauth"' "$file"
          for tool in whoami list_connections get_connection search_apps search_actions get_action; do
            grep -Fq "\"$tool\"" "$file"
          done
          for denied in create_connection delete_connection run_action api; do
            grep -Fq "\"$denied\"" "$file"
          done
          ! grep -Fq '@maton/mcp --api-key' "$file"
      - name: Verify Make probe is read-only and redacted
        shell: bash
        run: |
          set -euo pipefail
          file=pi/check-make-readonly.sh
          grep -Fq 'Authorization: Token $TOKEN' "$file"
          grep -Fq '/users/me?' "$file"
          grep -Fq '/organizations?' "$file"
          grep -Fq '/scenarios?teamId=' "$file"
          ! grep -Eq '(curl[^\n]*-[XP][[:space:]]*(POST|PATCH|PUT|DELETE)|/scenarios/[^ ]+/(start|stop|run)|/users/me/api-tokens)' "$file"
          ! grep -Eq '(echo|printf)[^\n]*\$TOKEN' "$file"
      - name: Verify n8n probe is read-only and local-first
        shell: bash
        run: |
          set -euo pipefail
          file=pi/check-n8n-readonly.sh
          grep -Fq 'X-N8N-API-KEY: $KEY' "$file"
          grep -Fq '/healthz' "$file"
          grep -Fq '/api/v1/workflows?limit=1' "$file"
          grep -Fq 'http://127.0.0.1:5678' "$file"
          ! grep -Eq '(curl[^\n]*-[XP][[:space:]]*(POST|PATCH|PUT|DELETE)|/api/v1/workflows/[^? ]+|/audit)' "$file"
          ! grep -Eq '(echo|printf)[^\n]*\$KEY' "$file"
      - name: Verify master bootstrap keeps high-risk lanes off
        shell: bash
        run: |
          set -euo pipefail
          file=pi/bootstrap-mobile-automation-safe.sh
          grep -Fq 'ROOT_JAILBREAK=OFF' "$file"
          grep -Fq 'PAID_OPENAI_AUTOMATIC_FALLBACK=OFF' "$file"
          grep -Fq 'SECOND_TELEGRAM_POLLER=OFF' "$file"
          grep -Fq 'ENABLE_QUEUE_TIMER="${ENABLE_QUEUE_TIMER:-0}"' "$file"
          ! grep -Eq '(enable-phone-write-lane|openclaw[[:space:]]+gateway[[:space:]]+restart|git[[:space:]]+push|gh[[:space:]]+pr[[:space:]]+merge|sudo[[:space:]])' "$file"
