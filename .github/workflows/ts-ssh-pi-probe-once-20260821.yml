name: Tailscale SSH Pi probe once

on:
  push:
    branches:
      - ops/ts-ssh-pi-probe-20260821-r5

permissions:
  contents: read
  id-token: write

concurrency:
  group: ts-ssh-pi-probe-20260821-r5
  cancel-in-progress: false

jobs:
  probe-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BROKER_URL: https://dpllasnpfskyyyzebyal.supabase.co/functions/v1/github-oidc-tailscale-ssh-probe-broker-once-20260821-r5
      OIDC_AUDIENCE: odi-ts-ssh-probe-3ee59790925f486a
      CORRELATION_ID: T4-FULL-RECOVERY-20260821
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Exchange GitHub OIDC for encrypted one-time values
        id: broker
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/recipient-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/recipient-private.pem \
            -pubout -outform DER -out /tmp/recipient-public.der
          PUBLIC_SPKI_B64="$(base64 -w0 /tmp/recipient-public.der)"

          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          unset OIDC_JSON

          python3 - "$PUBLIC_SPKI_B64" >/tmp/broker-body.json <<'PY'
          import json
          import sys
          print(json.dumps({"public_spki_b64": sys.argv[1]}, separators=(",", ":")))
          PY

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'content-type: application/json' \
            --data-binary @/tmp/broker-body.json \
            "$BROKER_URL" \
            -o /tmp/broker-response.json

          unset OIDC_TOKEN PUBLIC_SPKI_B64

          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/broker-response.json").read_text())
          if data.get("ok") is not True:
              raise SystemExit("broker_response_not_ok")

          Path("/tmp/auth-key.bin").write_bytes(
              base64.b64decode(data["encrypted_auth_key_b64"], validate=True)
          )
          Path("/tmp/bootstrap-token.bin").write_bytes(
              base64.b64decode(data["encrypted_bootstrap_token_b64"], validate=True)
          )

          safe = {
              "candidates": data.get("candidates", []),
              "expected_pi": data.get("expected_pi", {}),
              "bootstrap_runner": data.get("bootstrap_runner", {}),
              "recipient_public_spki_sha256": data.get("recipient_public_spki_sha256"),
              "secret_values_included": False,
          }
          Path("/tmp/broker-safe.json").write_text(
              json.dumps(safe, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          openssl pkeyutl -decrypt \
            -inkey /tmp/recipient-private.pem \
            -in /tmp/auth-key.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/tailscale-auth-key

          openssl pkeyutl -decrypt \
            -inkey /tmp/recipient-private.pem \
            -in /tmp/bootstrap-token.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/bootstrap-token

          AUTHKEY="$(cat /tmp/tailscale-auth-key)"
          BOOTSTRAP_TOKEN="$(cat /tmp/bootstrap-token)"
          [[ "$AUTHKEY" == tskey-auth-* ]]
          [[ ${#BOOTSTRAP_TOKEN} -ge 32 ]]

          echo "::add-mask::$AUTHKEY"
          echo "::add-mask::$BOOTSTRAP_TOKEN"

          {
            echo "authkey=$AUTHKEY"
            echo "bootstrap_token=$BOOTSTRAP_TOKEN"
          } >> "$GITHUB_OUTPUT"

          rm -f \
            /tmp/recipient-private.pem \
            /tmp/recipient-public.der \
            /tmp/auth-key.bin \
            /tmp/bootstrap-token.bin \
            /tmp/tailscale-auth-key \
            /tmp/bootstrap-token \
            /tmp/broker-response.json \
            /tmp/broker-body.json

      - name: Join authorized Tailnet ephemerally
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ steps.broker.outputs.authkey }}
          hostname: odi-ts-ssh-probe-${{ github.run_id }}
          statedir: /tmp/tailscale-state/
          version: 1.82.0
          timeout: 2m
          retry: 5

      - name: Download and verify one-time bootstrap runner
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts

          RUNNER_URL="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["bootstrap_runner"]["url"])')"
          RUNNER_BYTES="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["bootstrap_runner"]["bytes"])')"
          RUNNER_SHA="$(python3 -c 'import json; print(json.load(open("/tmp/broker-safe.json"))["bootstrap_runner"]["sha256"])')"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 2 --retry-delay 2 \
            "$RUNNER_URL" -o /tmp/pi-bootstrap-runner.sh

          test "$(wc -c < /tmp/pi-bootstrap-runner.sh | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum /tmp/pi-bootstrap-runner.sh | awk '{print $1}')" = "$RUNNER_SHA"
          bash -n /tmp/pi-bootstrap-runner.sh
          chmod 700 /tmp/pi-bootstrap-runner.sh

      - name: Probe through Tailscale SSH and recover only identified Pi
        id: route
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ steps.broker.outputs.bootstrap_token }}
        run: |
          set -Eeuo pipefail
          umask 077
          : > artifacts/ts-ssh-probe.log

          python3 - <<'PY' >/tmp/candidates.txt
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/broker-safe.json").read_text())
          seen = set()

          for row in data.get("candidates", []):
              name = str(row.get("name") or "")
              hostname = str(row.get("hostname") or "")
              for address in row.get("addresses", []):
                  address = str(address)
                  if "." in address and address not in seen:
                      seen.add(address)
                      print(address, name, hostname, sep="\t")

          previous = str(data.get("expected_pi", {}).get("previous_ip") or "")
          if previous and previous not in seen:
              print(previous, "previous-pi-address", "raspberry5", sep="\t")
          PY

          safe_probe='MODEL=unknown; if [ -r /proc/device-tree/model ]; then MODEL=$(tr -d "\000" </proc/device-tree/model | tr -cd "A-Za-z0-9 ._/-" | head -c 100); fi; OC=false; if command -v openclaw >/dev/null 2>&1 || [ -f "$HOME/.openclaw/openclaw.json" ]; then OC=true; fi; printf "SAFE host=%s user=%s arch=%s model=%s openclaw=%s\n" "$(hostname | tr -cd "A-Za-z0-9._-")" "$(id -un | tr -cd "A-Za-z0-9._-")" "$(uname -m | tr -cd "A-Za-z0-9._/-")" "$MODEL" "$OC"'

          MODE=""
          TARGET=""
          ACCESS_USER=""

          while IFS=$'\t' read -r candidate device_name device_hostname; do
            [[ -n "$candidate" ]] || continue
            timeout 15s tailscale ping --c 2 --timeout 5s "$candidate" >/dev/null 2>&1 || continue

            for user in mnwersdfppap pi ubuntu root; do
              INFO="$(timeout 25s tailscale ssh "${user}@${candidate}" "$safe_probe" 2>/dev/null || true)"
              [[ -n "$INFO" ]] || continue

              printf '%s target=%s login=%s device=%s hostname_hint=%s\n' \
                "$INFO" "$candidate" "$user" \
                "$(printf '%s' "$device_name" | tr -cd 'A-Za-z0-9._-')" \
                "$(printf '%s' "$device_hostname" | tr -cd 'A-Za-z0-9._-')" \
                >> artifacts/ts-ssh-probe.log

              if grep -Eqi 'openclaw=true|model=.*Raspberry|host=raspberry|host=mnwersdfppap' <<<"$INFO"; then
                MODE="tailscale_ssh"
                TARGET="$candidate"
                ACCESS_USER="$user"
                break 2
              fi
            done
          done </tmp/candidates.txt

          if [[ -z "$MODE" ]]; then
            printf '{"result":"blocked","reason":"no_tailscale_ssh_identity_path","secret_values_included":false}\n' \
              > artifacts/route-result.json
            cat artifacts/ts-ssh-probe.log || true
            exit 20
          fi

          python3 - "$BOOTSTRAP_TOKEN" /tmp/pi-bootstrap-runner.sh /tmp/remote-bootstrap.sh <<'PY'
          import pathlib
          import shlex
          import sys

          token, source, target = sys.argv[1:]
          script = pathlib.Path(source).read_text(encoding="utf-8")
          pathlib.Path(target).write_text(
              "export ODI_BOOTSTRAP_TOKEN=" + shlex.quote(token) + "\n" + script,
              encoding="utf-8",
          )
          pathlib.Path(target).chmod(0o700)
          PY

          unset BOOTSTRAP_TOKEN

          timeout 12m tailscale ssh "${ACCESS_USER}@${TARGET}" 'bash -s' \
            < /tmp/remote-bootstrap.sh \
            > artifacts/recovery-output.log 2>&1

          printf '{"result":"executed","mode":"tailscale_ssh","target":"%s","secret_values_included":false}\n' \
            "$TARGET" > artifacts/route-result.json

          {
            echo "mode=$MODE"
            echo "target=$TARGET"
            echo "access_user=$ACCESS_USER"
          } >> "$GITHUB_OUTPUT"

          rm -f /tmp/remote-bootstrap.sh /tmp/candidates.txt

      - name: Collect secret-free completion summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts

          python3 - <<'PY'
          import json
          from pathlib import Path

          route_path = Path("artifacts/route-result.json")
          route = (
              json.loads(route_path.read_text(encoding="utf-8"))
              if route_path.is_file()
              else {"result": "unknown"}
          )

          output_path = Path("artifacts/recovery-output.log")
          markers = []
          if output_path.is_file():
              text = output_path.read_text(encoding="utf-8", errors="replace")
              for marker in (
                  "ONE_TIME_SESSION_BOOTSTRAP_OK",
                  "AUTH_REPAIR_ARTIFACT_OK",
                  "AUTH_REPAIR_OK",
                  "AUTH_REPAIR_STAGE=PASS",
                  "FULL_RECOVERY_REDISPATCHED",
              ):
                  if marker in text:
                      markers.append(marker)
              output_path.write_text(
                  "\n".join(markers) + ("\n" if markers else ""),
                  encoding="utf-8",
              )

          summary = {
              "route_result": route.get("result"),
              "route_reason": route.get("reason"),
              "recovery_markers": markers,
              "pi_command_executed": route.get("result") == "executed",
              "correlation_id": "T4-FULL-RECOVERY-20260821",
              "auth_key_persisted": False,
              "bootstrap_token_persisted": False,
              "secret_values_included": False,
          }
          Path("artifacts/summary.json").write_text(
              json.dumps(summary, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps(summary, separators=(",", ":")))
          PY

          rm -f \
            /tmp/pi-bootstrap-runner.sh \
            /tmp/remote-bootstrap.sh \
            /tmp/candidates.txt \
            /tmp/broker-safe.json

      - name: Upload secret-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-ssh-pi-probe-r5-evidence
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 3
