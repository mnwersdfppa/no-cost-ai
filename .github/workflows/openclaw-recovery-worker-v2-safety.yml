name: Validate OpenClaw recovery worker v2 safety

on:
  pull_request:
    paths:
      - 'pi/openclaw-recovery-worker.py'
      - 'pi/openclaw-recovery-worker-v2.py'
      - 'pi/install-openclaw-recovery-worker-v2.sh'
      - '.github/workflows/openclaw-recovery-worker-v2-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-recovery-worker-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Compile Python sources
        run: |
          python -m py_compile \
            pi/openclaw-recovery-worker.py \
            pi/openclaw-recovery-worker-v2.py

      - name: Validate installer syntax
        run: bash -n pi/install-openclaw-recovery-worker-v2.sh

      - name: Validate fixed-handler and no-shell contract
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re

          files = [
              pathlib.Path('pi/openclaw-recovery-worker.py'),
              pathlib.Path('pi/openclaw-recovery-worker-v2.py'),
          ]
          contents = [path.read_text(encoding='utf-8') for path in files]
          text = '\n'.join(contents)
          trees = [ast.parse(content) for content in contents]

          required = {
              'pi_supabase_auth_model_recovery',
              'telegram_model_failover_repair',
              'worker_liveness_guardian',
              'pull_recovery',
          }
          missing = sorted(value for value in required if value not in text)
          assert not missing, f'missing recovery contract markers: {missing}'
          assert 'pi_infrastructure_recovery' not in text, 'obsolete broad recovery handler must stay retired'

          forbidden_calls = {'eval', 'exec', 'compile'}
          for tree in trees:
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  if isinstance(node.func, ast.Name):
                      assert node.func.id not in forbidden_calls, f'forbidden call: {node.func.id}'
                  for keyword in node.keywords:
                      if keyword.arg == 'shell':
                          assert not (
                              isinstance(keyword.value, ast.Constant)
                              and keyword.value.value is True
                          ), 'shell=True forbidden'

          # A source-level self-test may mention the word getUpdates. Reject
          # actual Telegram polling primitives rather than that inert assertion.
          polling_patterns = (
              r'api\.telegram\.org[^\n]{0,240}getUpdates',
              r'get_updates\s*\(',
              r'getupdates\s*\(',
          )
          for pattern in polling_patterns:
              assert re.search(pattern, text, re.IGNORECASE) is None, 'second Telegram poller primitive forbidden'
          assert re.search(r'curl\s*\|\s*(?:sh|bash)', text) is None, 'curl pipe shell forbidden'
          print('fixed_handler_contract=pass')
          PY

      - name: Reject committed secret literals
        run: |
          python - <<'PY'
          import pathlib
          import re

          targets = [
              pathlib.Path('pi/openclaw-recovery-worker.py'),
              pathlib.Path('pi/openclaw-recovery-worker-v2.py'),
              pathlib.Path('pi/install-openclaw-recovery-worker-v2.sh'),
          ]
          pattern = re.compile(
              r'(sk-proj-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|'
              r'xox[baprs]-[A-Za-z0-9-]{20,}|'
              r'tskey-(?:auth|api|client)-[A-Za-z0-9_-]{16,})'
          )
          for path in targets:
              assert pattern.search(path.read_text(encoding='utf-8')) is None, f'secret literal in {path}'
          print('secret_literal_scan=pass')
          PY

      - name: Confirm non-production workflow
        run: |
          ! grep -R -nE 'supabase functions deploy|vercel --prod|gh pr merge|git push .*main' \
            .github/workflows/openclaw-recovery-worker-v2-safety.yml
